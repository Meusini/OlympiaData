const QUARTER_SUBPATH = { ABCD: [], AB: ["A"], CD: ["B"], A: ["A","1"], B: ["A","2"], C: ["B","1"], D: ["B","2"] };

function inTrainingSeason(dateStr) {
  return TRAINING_SEASONS.some(([a, b]) => dateStr >= a && dateStr <= b);
}
// Colour class for a training title (mirrors ageClass for teams).
function trainingAge(title) {
  const t = title.trim();
  if (/^u\d+/i.test(t)) return ageClass({ team: t.toUpperCase() });
  if (/^GK/i.test(t)) return "gk";
  if (/^[DH]-?\d/i.test(t)) return "senior";
  if (/junior/i.test(t)) return "junior";
  if (/gents/i.test(t)) return "gent";
  if (/trimmers/i.test(t)) return "trim";
  if (/olympiaantjes/i.test(t)) return "u7";
  return "other";
}
// Training entries for one date, in the same shape as fieldGames so the field
// views can mix them with matches. Empty outside the outdoor windows and on weekends.
function trainingsOnDate(dateStr) {
  if (!inTrainingSeason(dateStr)) return [];
  const dow = new Date(dateStr + "T00:00:00").getDay();   // 0=Sun … 6=Sat
  return TRAINING_SCHEDULE.filter(x => x.d === dow).map(x => ({
    kind: "training",
    date: dateStr,
    time: x.s,
    end:  x.e,
    field: { fieldCode: x.f, subpath: QUARTER_SUBPATH[x.q] || [] },
    quarters: x.q,
    title: x.t,
    age: trainingAge(x.t),
    home: { club: "Olympia", team: x.t.split(/\s+/)[0] },
  }));
}
function ageOf(g) { return g.age || ageClass(g.home); }
function itemEnd(g) { return g.end || addMin(g.time, 60); }
function addMin(hhmm, n) {
  const m = toMin(hhmm) + n;
  return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
}
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
}
// Matches + trainings for one date. A training that collides with a match on the same
// pitch area is kept but flagged (conflict) — the match takes the field.
function itemsOnDate(dateStr) {
  const matches = gamesOnDate(state.fieldGames, dateStr);
  const trainings = trainingsOnDate(dateStr);
  for (const t of trainings) {
    const tr = subpathToRectPitch(t.field.subpath, { sheet: true });
    t.conflict = matches.some(m =>
      m.field.fieldCode === t.field.fieldCode &&
      toMin(m.time) < toMin(t.end) && toMin(t.time) < toMin(itemEnd(m)) &&
      rectsOverlap(tr, subpathToRectPitch(m.field.subpath)));
  }
  return [...matches, ...trainings].sort((a, b) => a.time.localeCompare(b.time));
}
function countLabel(items) {
  const m = items.filter(g => g.kind !== "training").length;
  const t = items.filter(g => g.kind === "training").length;
  const parts = [];
  if (m || !t) parts.push(`${m} wedstrijd${m === 1 ? "" : "en"}`);
  if (t) parts.push(`${t} training${t === 1 ? "" : "en"}`);
  return parts.join(" · ");
}

// ----- Load embedded data -----
function loadEmbedded() {
  const el = document.getElementById("games-data");
  const json = JSON.parse(el.textContent);
  // PowerShell quirks: empty arrays serialize as `{}`, and single-element arrays get
  // unwrapped into scalars (`subpath: "A"` instead of `["A"]`). Normalize both cases.
  const asArr = v => {
    if (Array.isArray(v)) return v;
    if (typeof v === "string" && v.length > 0) return [v];
    return [];
  };
  // Schema v2: fieldGames + teamGames + results + teams.
  // Older schema (single "games" array of home games) — fall back.
  const rawField = json.fieldGames || json.games || [];
  const fieldGames = rawField.map(g => ({
    kind: "match",
    date: g.date,
    time: g.time,
    field: { fieldCode: g.fieldCode, subpath: asArr(g.subpath) },
    division: g.division,
    home: { club: "Olympia", team: g.homeTeam },
    away: { club: g.awayClub, team: g.awayTeam },
  }));
  const teamGames = (json.teamGames || []).map(g => ({ ...g, subpath: asArr(g.subpath) }));
  return {
    updated:    json.updated,
    fieldGames,
    teamGames,
    results:    json.results   || [],
    teams:      json.teams     || [],
    poolGames:  json.poolGames || {},   // poolId -> array of pool-wide games (all teams in pool)
  };
}

function fmtDateAPI(d) {
  // Local YYYY-MM-DD — NOT toISOString(), which would round-trip via UTC and
  // silently subtract a day in positive-offset zones (Brussels is UTC+1/+2).
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${dd}`;
}
function fmtUpdated(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  return d.toLocaleString("nl-BE", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
}

// ----- Age class from team name (U7G-3, D-2, G-1, JL-1, T-1) -----
function ageClass(home) {
  const t = home.team || "";
  const m = t.match(/^U(\d+)/i);
  if (m) {
    const n = parseInt(m[1], 10);
    if (n <= 7) return "u7";
    if (n === 8) return "u8";
    if (n === 9) return "u9";
    if (n === 10) return "u10";
    if (n === 11) return "u11";
    if (n === 12) return "u12";
    if (n === 14) return "u14";
    if (n === 16) return "u16";
    return "u19";
  }
  if (/^G/i.test(t)) return "gent";
  if (/^JL|^JM|^J\d/i.test(t)) return "junior";
  if (/^T/i.test(t)) return "trim";
  if (/^D|^H/i.test(t)) return "senior";
  return "senior";
}

// ----- Subcell geometry -----
// Two coordinate systems:
//
//   subpathToRectPitch — physical geometry of the actual pitch (used in LAYOUT view).
//     Source of truth: the layout board next to Veld 5 (reference/veld5_layout_bord.jpg).
//     The board reads top→bottom B1, B2 | A1, A2 with a left / b right. The app looks at
//     the pitch from the other side, so it draws the board rotated 180°:
//       top→bottom A2, A1 | B2, B1 (A1 and B2 touch the centre line); left→right b, a.
//     opts.sheet      — training-sheet quarters: plain top→bottom order, no board rotation.
//     opts.lengthwise — Set of halves in which U9 plays. Since 2024-25 U9 plays on a quarter
//       pitch LENGTHWISE (backline → centre line, ~45 x 25 m, Hockey Belgium table v1.11), so
//       in those halves "1"/"2" are the two side-by-side quadrants, not the crosswise bands.
//       Which of the two is left or right is not in the data — 1 = a-side, 2 = b-side is a guess.
//
//   subpathToRectTimeline — packing for the TIMELINE view, where horizontal
//     space is exclusive (no two games can share a column). Here A/B are a
//     left/right split so the half-pitch games sit side by side in the column,
//     and 1/2 stays a top/bottom split inside that column (so simultaneous
//     B1a/B2a stack vertically within the time-block).
function subpathToRectPitch(subpath, opts) {
  opts = opts || {};
  let x=0, y=0, w=100, h=100;
  const lengthwise = !!(opts.lengthwise && opts.lengthwise.has(subpath[0]));
  for (const part of subpath) {
    if (part === "A" || part === "B") {
      h = h / 2;
      if (part === "B") y = y + h;
    } else if (part === "1" || part === "2") {
      if (lengthwise) {
        w = w / 2;
        if (part === "1") x = x + w;                       // 1 = a-side (right), 2 = b-side (left)
      } else {
        h = h / 2;
        if (opts.sheet ? part === "2" : part === "1") y = y + h;   // board rotated: 2 above 1
      }
    } else if (part === "a" || part === "b") {
      w = w / 2;
      if (opts.sheet ? part === "b" : part === "a") x = x + w;     // board rotated: b left, a right
    }
  }
  return { x, y, w, h };
}
// U9 match on a "half + 1/2" sub-field → drawn as a lengthwise quadrant.
function isU9Quadrant(g) {
  return g.kind !== "training" && /^U9/i.test((g.home && g.home.team) || "") &&
    g.field.subpath.length === 2 && /^[12]$/.test(g.field.subpath[1]);
}
function subpathToRectTimeline(subpath) {
  let x=0, y=0, w=100, h=100;
  for (const part of subpath) {
    if (part === "A" || part === "B") {
      w = w / 2;
      if (part === "B") x = x + w;
    } else if (part === "1" || part === "2") {
      h = h / 2;
      if (part === "2") y = y + h;
    } else if (part === "a" || part === "b") {
      w = w / 2;
      if (part === "b") x = x + w;
    }
  }
  return { x, y, w, h };
}
function otherSibling(c) {
  return { "A":"B", "B":"A", "1":"2", "2":"1", "a":"b", "b":"a" }[c] || c;
}
function planFieldSubcells(games, opts) {
  if (games.length === 0) {
    return [{ rect: { x:0, y:0, w:100, h:100 }, subpath: [], empty: true }];
  }
  const used = games.map(g => ({ rect: subpathToRectPitch(g.subpath, opts), game: g, subpath: g.subpath, empty: false }));
  const emptyRects = [];
  const seen = new Set();
  for (const g of games) {
    for (let i = 1; i <= g.subpath.length; i++) {
      const prefix = g.subpath.slice(0, i);
      const sibPath = [...prefix.slice(0,-1), otherSibling(prefix[prefix.length-1])];
      const sibKey = sibPath.join("");
      if (seen.has(sibKey)) continue;
      seen.add(sibKey);
      const occupied = games.some(g2 => {
        const sp = g2.subpath.join("");
        return sp === sibKey || sp.startsWith(sibKey);
      });
      if (!occupied) {
        emptyRects.push({ rect: subpathToRectPitch(sibPath, opts), subpath: sibPath, empty: true });
      }
    }
  }
  return [...used, ...emptyRects];
}

// ----- Filtering -----
function gamesOnDate(games, dateStr) {
  return games.filter(g => g.date === dateStr).sort((a,b) => a.time.localeCompare(b.time));
}

// ----- Rendering: TIMELINE -----
function renderTimeline(games) {
  const main = document.getElementById("main");
  if (games.length === 0) {
    main.innerHTML = `<div class="empty">Geen wedstrijden op deze dag.</div>`;
    return;
  }
  const hourHeight = PX_PER_HOUR;
  const totalH = (TIMELINE_END_H - TIMELINE_START_H) * hourHeight;

  // On phones, render ONE field column at a time (controlled by the pill switcher).
  // Default to the field with the most games today so phone-users land on something useful.
  const isMobile = window.matchMedia("(max-width: 720px)").matches;
  if (!state.mobileTimelineField) {
    let best = FIELDS[0].code, bestN = -1;
    for (const f of FIELDS) {
      const n = games.filter(g => g.field.fieldCode === f.code).length;
      if (n > bestN) { bestN = n; best = f.code; }
    }
    state.mobileTimelineField = best;
  }
  const visibleFields = isMobile
    ? FIELDS.filter(f => f.code === state.mobileTimelineField)
    : FIELDS;
  const axisW = isMobile ? 44 : 60;
  const colTemplate = `${axisW}px repeat(${visibleFields.length}, 1fr)`;

  // Field switcher dropdown (CSS shows it only on mobile). Native <select> = native picker.
  let html = `<div class="mobile-field-switcher">
    <label for="mfield-select">Veld:</label>
    <select id="mfield-select">`;
  for (const f of FIELDS) {
    const n = games.filter(g => g.field.fieldCode === f.code).length;
    const sel = f.code === state.mobileTimelineField ? " selected" : "";
    html += `<option value="${f.code}"${sel}>${escape(f.label)} — ${n} wedstrijd${n===1?"":"en"}</option>`;
  }
  html += `</select></div>`;

  html += `<div class="timeline-wrap" style="grid-template-rows: auto ${totalH}px; grid-template-columns: ${colTemplate};">`;
  html += `<div class="col-header" style="background:transparent;border:none;"></div>`;
  for (const f of visibleFields) {
    const n = games.filter(g => g.field.fieldCode === f.code).length;
    html += `<div class="col-header">${f.label} <span class="count">${n} wedstrijden</span></div>`;
  }
  html += `<div class="time-axis" style="position:relative; height:${totalH}px;">`;
  for (let h = TIMELINE_START_H; h <= TIMELINE_END_H; h++) {
    const top = (h - TIMELINE_START_H) * hourHeight;
    html += `<div class="hour" style="top:${top}px">${String(h).padStart(2,"0")}:00</div>`;
  }
  html += `</div>`;

  for (const f of visibleFields) {
    html += `<div class="field-col" style="height:${totalH}px">`;
    for (let h = TIMELINE_START_H; h <= TIMELINE_END_H; h++) {
      const top = (h - TIMELINE_START_H) * hourHeight;
      html += `<div class="hour-line" style="top:${top}px"></div>`;
    }
    const fieldGames = games.filter(g => g.field.fieldCode === f.code);
    const byTime = new Map();
    fieldGames.forEach(g => {
      if (!byTime.has(g.time)) byTime.set(g.time, []);
      byTime.get(g.time).push(g);
    });
    for (const [time, list] of byTime) {
      const [hh, mm] = time.split(":").map(Number);
      const top = ((hh + mm/60) - TIMELINE_START_H) * hourHeight;
      const height = hourHeight * 1.0 - 4;
      // Group simultaneous games on this field by their horizontal column (x,w).
      // Games sharing a column (e.g. B1a/B2a — same x, same w, different y on the pitch)
      // get stacked vertically inside the time-block using their rect.y / rect.h.
      const cols = new Map();
      list.forEach(g => {
        const r = g.field.subpath.length ? subpathToRectTimeline(g.field.subpath) : { x:0, y:0, w:100, h:100 };
        const key = `${r.x}|${r.w}`;
        if (!cols.has(key)) cols.set(key, { x: r.x, w: r.w, items: [] });
        cols.get(key).items.push({ g, r });
      });
      for (const col of cols.values()) {
        col.items.forEach(({ g, r }) => {
          const subTop    = top + (r.y / 100) * height;
          const subHeight = (r.h / 100) * height - 2;
          const ageCls = `age-${ageClass(g.home)}`;
          const subLabel = g.field.subpath.length ? g.field.subpath.join("") : "";
          // When a cell is short (stacked half-cell) or narrow (deep subdivision),
          // drop the division line and tighten typography so the team names survive.
          const cramped = subHeight < 80 || g.field.subpath.length >= 3;
          const showDiv = subHeight >= 70;
          html += `<div class="game ${ageCls}${cramped ? ' cramped' : ''}" style="
              top:${subTop}px; height:${subHeight}px;
              left: calc(${col.x}% + 4px);
              width: calc(${col.w}% - 8px);
              ">
            <div class="time">${time}${subLabel?` <span class="sub">${subLabel}</span>`:""}</div>
            <div class="teams"><span class="team-link" data-team="${escape(g.home.team)}">${escape(g.home.team)}</span> – ${escape(g.away.club)} ${escape(g.away.team)}</div>
            ${showDiv ? `<div class="div">${escape(cleanDivision(g.division))}</div>` : ``}
          </div>`;
        });
      }
    }
    html += `</div>`;
  }
  html += `</div>`;
  html += renderLegend();
  main.innerHTML = html;

  // Mobile field-switcher dropdown — re-render to swap the visible column
  const mSel = main.querySelector("#mfield-select");
  if (mSel) mSel.addEventListener("change", e => {
    state.mobileTimelineField = e.target.value;
    render();
  });
}

// ----- Rendering: LAYOUT -----
// A game is "active" at a slot if it started within the previous 60 min
// (i.e. game runs from g.time .. g.time+60min and slot falls in that range).
function toMin(hhmm) { const [h,m] = hhmm.split(":").map(Number); return h*60+m; }
function isActiveAt(game, slot) {
  const g = toMin(game.time), s = toMin(slot);
  return s >= g && s < toMin(itemEnd(game));
}
// Font sizing by subdivision depth: full field gets huge text; subdivided cells smaller.
function fontForDepth(depth) {
  // depth 0 (full), 1 (half), 2 (quarter), 3 (eighth)
  return Math.max(11, 22 - depth * 4);
}

// Mini-map of the club site — spatial reference shown at the top of Veldbezetting.
// Each pitch box is clickable; selected pitch (single-field mode) is highlighted.
function renderClubMapHtml(games, highlightedField) {
  const cellCounts = {};
  for (const f of FIELDS) {
    cellCounts[f.code] = games.filter(g => g.field.fieldCode === f.code).length;
  }
  const cls = code => {
    const c = [];
    if (cellCounts[code] > 0) c.push("has-games");
    if (highlightedField === code) c.push("selected");
    return c.join(" ");
  };
  const ct = code => cellCounts[code] > 0 ? `<tspan class="map-count"> · ${cellCounts[code]}</tspan>` : "";
  return `<div class="club-map" aria-label="Plattegrond club">
    <svg viewBox="0 0 300 175" preserveAspectRatio="xMidYMid meet">
      <rect class="map-pitch ${cls('2')}" data-mapfield="2" x="6"   y="6"   width="80" height="76" rx="6"/>
      <text class="map-label"             x="46"  y="50" text-anchor="middle">Veld 2${ct('2')}</text>
      <rect class="map-pitch ${cls('1')}" data-mapfield="1" x="96"  y="6"   width="80" height="76" rx="6"/>
      <text class="map-label"             x="136" y="50" text-anchor="middle">Veld 1${ct('1')}</text>
      <rect class="map-clubhouse"                             x="216" y="6"   width="60" height="76" rx="6"/>
      <text class="map-label clubhouse-label" x="246" y="50" text-anchor="middle">Clubhuis</text>
      <rect class="map-pitch ${cls('5')}" data-mapfield="5" x="96"  y="92"  width="80" height="76" rx="6"/>
      <text class="map-label"             x="136" y="136" text-anchor="middle">Veld 5${ct('5')}</text>
    </svg>
  </div>`;
}

// "Veldbezetting" tab — two modes via slider:
//   Alle velden = pick a time slot, see all 3 pitches with the games occupying each
//                 subdivision RIGHT NOW (the spatial / "where is everything happening").
//   Eén veld    = pick one field, see its full-day timeline.
// Mini-map always sits on top as a wayfinding reference.
function renderVeldbezetting() {
  const main = document.getElementById("main");
  const games = itemsOnDate(state.date);   // matches + trainings, same shape
  const isMobile = window.matchMedia("(max-width: 720px)").matches;

  // Modes: "day" (Dagplanning — full-day timeline) | "slot" (Veldverdeling — pitch view per slot)
  // Migrate legacy "all"/"one" values into the new names.
  if (state.veldbezettingMode === "all") state.veldbezettingMode = "slot";
  if (state.veldbezettingMode === "one") state.veldbezettingMode = "day";
  if (!state.veldbezettingMode) state.veldbezettingMode = "day";
  // Default selected field (busiest today) for single-field mode
  if (!state.selectedField || !FIELDS.find(f => f.code === state.selectedField)) {
    let best = FIELDS[0].code, bestN = -1;
    for (const f of FIELDS) {
      const n = games.filter(g => g.field.fieldCode === f.code).length;
      if (n > bestN) { bestN = n; best = f.code; }
    }
    state.selectedField = best;
  }
  const mode = state.veldbezettingMode;

  // 1. Mini map (only shown on phones via CSS; on desktop you already see all 3 fields)
  let html = renderClubMapHtml(games, mode === "day" && isMobile ? state.selectedField : null);

  // 2. Slider
  html += `<div class="vb-controls">
    <div class="view-toggle" role="tablist">
      <button data-vmode="day"  class="${mode==='day' ?'active':''}" role="tab">Dagplanning</button>
      <button data-vmode="slot" class="${mode==='slot'?'active':''}" role="tab">Veldverdeling</button>
    </div>`;

  if (games.length === 0) {
    html += `</div>`;
    html += `<div class="empty">Geen wedstrijden of trainingen op deze dag.</div>`;
    main.innerHTML = html;
    wireVbInteractions(main);
    return;
  }

  // 3. Secondary control — slot picker (Veldverdeling) OR field picker (Dagplanning on mobile only)
  if (mode === "slot") {
    const slots = [...new Set(games.map(g => g.time))].sort();
    if (!state.activeSlot || !slots.includes(state.activeSlot)) {
      state.activeSlot = pickDefaultSlot(slots);
    }
    html += `<select id="vb-slot-select">
      ${slots.map(s => `<option value="${s}"${s===state.activeSlot?" selected":""}>${escape(s)}</option>`).join("")}
    </select>`;
  } else if (mode === "day" && isMobile) {
    // Desktop Dagplanning shows all 3 fields side-by-side — no dropdown needed.
    html += `<select id="vb-field-select">`;
    for (const f of FIELDS) {
      const sel = f.code === state.selectedField ? " selected" : "";
      html += `<option value="${f.code}"${sel}>${escape(f.label)} — ${countLabel(games.filter(g => g.field.fieldCode === f.code))}</option>`;
    }
    html += `</select>`;
  }
  html += `</div>`;

  // 4. Body
  if (mode === "slot") {
    html += renderAllFieldsAtSlot(games, state.activeSlot);
  } else {
    const fieldsToShow = isMobile ? [FIELDS.find(f => f.code === state.selectedField)] : FIELDS;
    html += renderTimelineFields(games, fieldsToShow, isMobile);
  }
  main.innerHTML = html;
  wireVbInteractions(main);
}

function wireVbInteractions(main) {
  main.querySelectorAll(".view-toggle button").forEach(b => {
    b.addEventListener("click", () => { state.veldbezettingMode = b.dataset.vmode; render(); });
  });
  const vss = main.querySelector("#vb-slot-select");
  if (vss) vss.addEventListener("change", e => { state.activeSlot = e.target.value; render(); });
  const vfs = main.querySelector("#vb-field-select");
  if (vfs) vfs.addEventListener("change", e => { state.selectedField = e.target.value; render(); });
  main.querySelectorAll(".club-map [data-mapfield]").forEach(el => {
    el.addEventListener("click", () => {
      state.veldbezettingMode = "one";
      state.selectedField = el.dataset.mapfield;
      render();
    });
  });
}

// "Alle velden" body — 3 pitches showing games active at activeSlot, with subdivisions.
function renderAllFieldsAtSlot(games, activeSlot) {
  let html = `<div class="fields-row">`;
  for (const cell of LAYOUT_GRID) {
    const gridStyle = `grid-column:${cell.col};grid-row:${cell.row};`;
    if (cell.type === "clubhuis") {
      html += `<div class="field-card clubhuis" style="${gridStyle}" title="${escape(cell.label)}">
        <div class="clubhuis-box" aria-label="${escape(cell.label)}">
          <span class="clubhuis-icon" aria-hidden="true">⌂</span>
          <span class="clubhuis-text">CLUBHUIS</span>
        </div>
      </div>`;
      continue;
    }
    const f = cell;
    const activeGames = games.filter(g => isActiveAt(g, activeSlot) && g.field.fieldCode === f.code);
    // On the pitch drawing a conflicting training would sit under the match — draw only the match.
    const drawn = activeGames.filter(g => !(g.kind === "training" && g.conflict));
    const geo = {
      sheet: drawn.length > 0 && drawn.every(g => g.kind === "training"),
      lengthwise: new Set(drawn.filter(isU9Quadrant).map(g => g.field.subpath[0])),
    };
    // U9 safety band: the quarter behind the U9 goals on the centre line must stay free
    // (Hockey Belgium). The club books U7/U8 on the band next to the centre line while the
    // far band is empty — draw them on the far band and show the near band as kept free.
    const shown = new Map(), safetyBands = new Set();
    for (const H of geo.lengthwise) {
      const O = H === "A" ? "B" : "A";
      if (geo.lengthwise.has(O)) continue;
      const near = O === "B" ? "2" : "1", far = near === "1" ? "2" : "1";   // A1 and B2 touch the centre line
      const inO = drawn.filter(g => g.field.subpath[0] === O);
      const nearGames = inO.filter(g => g.field.subpath[1] === near);
      const farTaken = inO.some(g => g.field.subpath.length < 2 || g.field.subpath[1] === far);
      if (nearGames.length && !farTaken) {
        nearGames.forEach(g => shown.set(g, [O, far, ...g.field.subpath.slice(2)]));
        safetyBands.add(O + near);
      }
    }
    const cells = planFieldSubcells(drawn.map(g => ({ subpath: shown.get(g) || g.field.subpath, game: g })), geo);
    const idle = activeGames.length === 0;
    html += `<div class="field-card ${idle?"idle":""}" style="${gridStyle}">
      <h3>${f.label} <span class="meta">${countLabel(activeGames)}</span></h3>
      <div class="pitch">${pitchMarkingsSvg()}`;
    for (const c of cells) {
      const r = c.rect;
      // Filled cells keep the label from the data (what parents see on hockey.be).
      const labelPath = c.empty ? c.subpath : c.game.game.field.subpath;
      const subLabel = labelPath.length ? labelPath.join("") : "vol veld";
      if (c.empty) {
        const safety = safetyBands.has(c.subpath.join(""));
        html += `<div class="subcell empty${safety ? ' safety' : ''}" style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%;">
          <span class="label empty-lbl">${safety ? 'vrij · achter U9-doelen' : subLabel}</span></div>`;
      } else if (c.game.game.kind === "training") {
        const g = c.game.game;
        const depth = g.field.subpath.length;
        const fs = fontForDepth(depth);
        html += `<div class="subcell filled training age-${ageOf(g)}"
            style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%;font-size:${fs}px;">
          <span class="label">${escape(g.quarters === "ABCD" ? "vol veld" : g.quarters)}</span>
          <span class="kind-tag">training</span>
          <div class="game-mini">
            <span class="team">${escape(g.title)}</span>
            ${depth < 2 ? `<span class="div">${g.time}–${g.end}</span>` : ''}
          </div>
        </div>`;
      } else {
        const g = c.game.game;
        const ageCls = `age-${ageClass(g.home)}`;
        const depth = g.field.subpath.length;
        const fs = fontForDepth(depth);
        const isCarry = g.time !== activeSlot;
        html += `<div class="subcell filled ${ageCls} ${isCarry?'carryover':''}"
            style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%;font-size:${fs}px;">
          <span class="label">${subLabel}</span>
          ${isCarry ? `<span class="carry-tag">${g.time}</span>` : ''}
          <div class="game-mini">
            <span class="team">${olympiaLink(g.home.team)}</span>
            <span class="vs">vs</span>
            <span class="team">${escape(g.away.club)} ${escape(g.away.team)}</span>
            ${depth < 2 ? `<span class="div">${escape(shortDiv(g.division))}</span>` : ''}
          </div>
        </div>`;
      }
    }
    html += `</div>`;
    // The pitch already shows who plays where — no list underneath. Only a training that is
    // hidden under a match (not drawn) gets a line, because nothing else shows it.
    const hidden = activeGames.filter(g => g.kind === "training" && g.conflict);
    if (hidden.length) {
      html += `<div class="games-list">` + hidden.map(g => `<div class="row training">
        <span class="t">${g.time}</span>
        <span class="s"><span class="match-teams">${escape(g.title)}</span>
          <span class="match-div">Training · <span class="conflict-tag">⚠ wedstrijd op dit veld</span></span></span>
      </div>`).join("") + `</div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

// "Dagplanning" body — timeline of one or more fields full day.
// Used for both single-field (mobile) and all-3-fields (desktop) variants.
function renderTimelineFields(games, fieldsArr, isMobile) {
  const hourHeight = PX_PER_HOUR;
  const totalH = (TIMELINE_END_H - TIMELINE_START_H) * hourHeight;
  const axisW = isMobile ? 44 : 60;
  let html = `<div class="timeline-wrap" style="grid-template-rows: auto ${totalH}px; grid-template-columns: ${axisW}px repeat(${fieldsArr.length}, 1fr);">`;
  html += `<div class="col-header" style="background:transparent;border:none;"></div>`;
  for (const f of fieldsArr) {
    html += `<div class="col-header">${f.label} <span class="count">${countLabel(games.filter(g => g.field.fieldCode === f.code))}</span></div>`;
  }
  html += `<div class="time-axis" style="position:relative; height:${totalH}px;">`;
  for (let h = TIMELINE_START_H; h <= TIMELINE_END_H; h++) {
    const top = (h - TIMELINE_START_H) * hourHeight;
    html += `<div class="hour" style="top:${top}px">${String(h).padStart(2,"0")}:00</div>`;
  }
  html += `</div>`;
  for (const f of fieldsArr) {
    html += `<div class="field-col" style="height:${totalH}px">`;
    for (let h = TIMELINE_START_H; h <= TIMELINE_END_H; h++) {
      const top = (h - TIMELINE_START_H) * hourHeight;
      html += `<div class="hour-line" style="top:${top}px"></div>`;
    }
    const fieldGames = games.filter(g => g.field.fieldCode === f.code);
    // Each block is positioned independently: top from its start, height from its own
    // duration (matches = 60 min, trainings = sheet end time), x/width from the subpath.
    fieldGames.forEach(g => {
      const time = g.time;
      const top = (toMin(time) / 60 - TIMELINE_START_H) * hourHeight;
      const height = ((toMin(itemEnd(g)) - toMin(time)) / 60) * hourHeight - 4;
      const r = g.field.subpath.length ? subpathToRectTimeline(g.field.subpath) : { x:0, y:0, w:100, h:100 };
      const subTop    = top + (r.y / 100) * height;
      const subHeight = (r.h / 100) * height - 2;
      const ageCls = `age-${ageOf(g)}`;
      const cramped = subHeight < 80 || g.field.subpath.length >= 3;
      const showDiv = subHeight >= 70;
      const pos = `top:${subTop}px; height:${subHeight}px; left: calc(${r.x}% + 4px); width: calc(${r.w}% - 8px);`;
      if (g.kind === "training") {
        const subLabel = g.quarters === "ABCD" ? "" : g.quarters;
        html += `<div class="game training ${ageCls}${cramped ? ' cramped' : ''}${g.conflict ? ' conflict' : ''}" style="${pos}"
              title="Training ${escape(g.title)} ${time}–${g.end}${g.conflict ? ' — wedstrijd op dit veld' : ''}">
          <div class="time">${time}–${g.end}${subLabel?` <span class="sub">${subLabel}</span>`:""}<span class="kind">${g.conflict ? '⚠ training' : 'training'}</span></div>
          <div class="teams">${escape(g.title)}</div>
        </div>`;
        return;
      }
      const subLabel = g.field.subpath.length ? g.field.subpath.join("") : "";
      html += `<div class="game match ${ageCls}${cramped ? ' cramped' : ''}" style="${pos}">
        <div class="time">${time}${subLabel?` <span class="sub">${subLabel}</span>`:""}</div>
        <div class="teams"><span class="team-link" data-team="${escape(g.home.team)}">${escape(g.home.team)}</span> – ${escape(g.away.club)} ${escape(g.away.team)}</div>
        ${showDiv ? `<div class="div">${escape(cleanDivision(g.division))}</div>` : ``}
      </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

// Hockey-pitch markings overlay — drawn behind the subcell overlays in .pitch.
// Coordinate system: 55x91 (real-world meters), portrait orientation. Markings included:
//   outer border, centre line, both 23-m lines (solid), two D shooting circles (solid),
//   two 5-m broken lines outside each D, penalty spots, goals.
function pitchMarkingsSvg() {
  // White strokes high-opacity so they read on the green pitch.
  // For the D circles we draw FULL circles centred on the goal mouth (y=0 / y=91) —
  // the .pitch's overflow:hidden naturally clips off the half outside the field,
  // leaving a clean semicircle. This avoids the degenerate arc rendering issue
  // where chord == diameter (some browsers refuse to draw such arcs).
  const SOLID = "rgba(255,255,255,.70)";
  const DASH  = "rgba(255,255,255,.55)";
  const W_OUT = 0.55;
  const W_DASH= 0.45;
  return `<svg class="pitch-lines" viewBox="0 0 55 91" preserveAspectRatio="none" aria-hidden="true" overflow="visible">
    <!-- Outer border -->
    <rect x="0.3" y="0.3" width="54.4" height="90.4" fill="none" stroke="${SOLID}" stroke-width="${W_OUT}"/>
    <!-- Centre line (solid) -->
    <line x1="0" y1="45.5" x2="55" y2="45.5" stroke="${SOLID}" stroke-width="${W_OUT}"/>
    <!-- 23-meter lines (solid) -->
    <line x1="0" y1="22.9" x2="55" y2="22.9" stroke="${SOLID}" stroke-width="${W_OUT}"/>
    <line x1="0" y1="68.1" x2="55" y2="68.1" stroke="${SOLID}" stroke-width="${W_OUT}"/>
    <!-- TOP D shooting circle (radius 14.63m). Full circle, top half clipped by .pitch overflow. -->
    <circle cx="27.5" cy="0"  r="14.63" fill="none" stroke="${SOLID}" stroke-width="${W_OUT}"/>
    <!-- TOP 5-m broken line (5m outside the D) -->
    <circle cx="27.5" cy="0"  r="19.63" fill="none" stroke="${DASH}"  stroke-width="${W_DASH}" stroke-dasharray="1.8,1.2"/>
    <!-- BOTTOM D -->
    <circle cx="27.5" cy="91" r="14.63" fill="none" stroke="${SOLID}" stroke-width="${W_OUT}"/>
    <!-- BOTTOM 5-m broken line -->
    <circle cx="27.5" cy="91" r="19.63" fill="none" stroke="${DASH}"  stroke-width="${W_DASH}" stroke-dasharray="1.8,1.2"/>
    <!-- Penalty spots (6.4m from goal line) -->
    <circle cx="27.5" cy="6.4"  r="0.6" fill="${SOLID}"/>
    <circle cx="27.5" cy="84.6" r="0.6" fill="${SOLID}"/>
    <!-- Goals (3.66m wide, protruding just outside the goal line) -->
    <rect x="25.67" y="-0.8" width="3.66" height="1.6" fill="rgba(255,255,255,.75)"/>
    <rect x="25.67" y="90.2" width="3.66" height="1.6" fill="rgba(255,255,255,.75)"/>
  </svg>`;
}

// Stub: old renderLayout (slot-picker view) deleted — Veldbezetting replaces it.
function renderLayout(games, _) {
  renderVeldbezetting();
}

// Original renderLayout body (unused, kept commented for ref).
// eslint-disable-next-line
function _renderLayoutLegacy(games, activeSlot) {
  const main = document.getElementById("main");
  const slots = [...new Set(games.map(g => g.time))].sort();
  if (games.length === 0) {
    main.innerHTML = `<div class="empty">Geen wedstrijden op deze dag.</div>`;

  }
  if (!activeSlot || !slots.includes(activeSlot)) activeSlot = pickDefaultSlot(slots);

  let html = `<div class="layout-controls"><label class="now-label" for="slot-select">Tijdslot</label>

    </select>
  </div>`;
  html += `<div class="fields-row">`;
  for (const cell of LAYOUT_GRID) {
    const gridStyle = `grid-column:${cell.col};grid-row:${cell.row};`;

      html += `<div class="field-card clubhuis" style="${gridStyle}" title="${escape(cell.label)}">
        <div class="clubhuis-box" aria-label="${escape(cell.label)}">
          <span class="clubhuis-icon" aria-hidden="true">⌂</span>
          <span class="clubhuis-text">CLUBHUIS</span>
        </div>
      </div>`;
      continue;
    }
    const f = cell;
    // Active = games started at this slot OR carried over from up to 60 min earlier
    const activeGames = games.filter(g => isActiveAt(g, activeSlot) && g.field.fieldCode === f.code);
    const cells = planFieldSubcells(activeGames.map(g => ({ subpath: g.field.subpath, game: g })));
    const idle = activeGames.length === 0;
    html += `<div class="field-card ${idle?"idle":""}" style="${gridStyle}">
      <h3>${f.label} <span class="meta">${activeGames.length} wedstrijd${activeGames.length===1?"":"en"}</span></h3>
      <div class="pitch">${pitchMarkingsSvg()}`;
    for (const c of cells) {
      const r = c.rect;
      const subLabel = c.subpath.length ? c.subpath.join("") : "vol veld";
      if (c.empty) {
        html += `<div class="subcell empty" style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%;">
          <span class="label empty-lbl">${subLabel}</span></div>`;
      } else {
        const g = c.game.game;
        const ageCls = `age-${ageClass(g.home)}`;
        const depth = g.field.subpath.length;
        const fs = fontForDepth(depth);
        const isCarry = g.time !== activeSlot;
        html += `<div class="subcell filled ${ageCls} ${isCarry?'carryover':''}"
            style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%;font-size:${fs}px;">
          <span class="label">${subLabel}</span>
          ${isCarry ? `<span class="carry-tag">${g.time}</span>` : ''}
          <div class="game-mini">
            <span class="team">${olympiaLink(g.home.team)}</span>
            <span class="vs">vs</span>
            <span class="team">${escape(g.away.club)} ${escape(g.away.team)}</span>
            ${depth < 2 ? `<span class="div">${escape(shortDiv(g.division))}</span>` : ''}
          </div>
        </div>`;
      }
    }
    html += `</div>`;
    if (activeGames.length === 0) {
      html += `<div class="games-list">Geen wedstrijd in dit tijdslot</div>`;
    } else {
      html += `<div class="games-list">`;
      activeGames.forEach(g => {
        const sp = g.field.subpath.length ? g.field.subpath.join("") : "vol veld";
        const carry = g.time !== activeSlot;
        html += `<div class="row${carry?' carry':''}">
          <span class="t">${g.time}</span>
          <span class="s">
            <span class="match-teams">${olympiaLink(g.home.team)} – ${escape(g.away.club)} ${escape(g.away.team)}</span>
            <span class="match-div">${escape(cleanDivision(g.division))}</span>
          </span>
          <span class="sub-tag">${sp}</span>
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  html += renderLegend();
  main.innerHTML = html;

  const slotSel = main.querySelector("#slot-select");
  if (slotSel) slotSel.addEventListener("change", e => {
    state.activeSlot = e.target.value;
    render();
  });
  // Map: click a pitch in the mini map → scroll that field's card into view
  main.querySelectorAll(".club-map [data-mapfield]").forEach(el => {
    el.addEventListener("click", () => {
      const code = el.dataset.mapfield;
      // Find the field-card whose <h3> starts with the matching label
      const target = [...main.querySelectorAll(".field-card h3")]
        .find(h => h.textContent.trim().startsWith(`Veld ${code}`));
      if (target) target.scrollIntoView({ behavior:"smooth", block:"start" });
    });
  });
}

function pickDefaultSlot(slots) {
  const today = new Date(state.date + "T00:00:00");
  const now = new Date();
  if (today.toDateString() === now.toDateString()) {
    const hhmm = now.toTimeString().slice(0,5);
    return slots.find(s => s >= hhmm) || slots[slots.length - 1];
  }
  return slots[0];
}

function renderLegend() {
  const items = [

function shortDiv(div) {

}
// Strip the literal " (2)" segment Sportlink injects into youth division names
// ("U10 Boys (2) - HV 1 B") — meaningless to club users, just visual noise.
function cleanDivision(div) {
  if (!div) return "";
  return div.replace(/\s*\(2\)\s*/g, " ").replace(/\s+/g, " ").trim();
}
function escape(s) {
  return (s || "").replace(/[<>&"]/g, ch => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[ch]));
}
function formatDDMM(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");

}

// Unified match-row markup — same shape for every match list (Resultaten, Komende, Laatste,
// Vorige speeldag uitslagen, Veldverdeling games-list). Five columns:
//   date | homeTeam (right-aligned) | mid pill (score / time) | awayTeam (left-aligned) | trail
// The mid pill colors itself by outcome (win/loss/draw) for past results, or sits as a quiet
// time chip for upcoming games. Trail is outcome letter (past), or field-badge / map link (upcoming).
function unifiedMatchRow(p) {
  const cls = p.className ? `umr ${p.className}` : "umr";
  const date = `<span class="umr-date">${p.date ? escape(p.date) : ""}</span>`;
  const home = `<span class="umr-home">${p.homeHtml || ""}</span>`;
  const midCls = p.midCls ? `umr-mid ${p.midCls}` : "umr-mid";
  const mid  = `<span class="${midCls}">${p.mid ? escape(p.mid) : ""}</span>`;
  const away = `<span class="umr-away">${p.awayHtml || ""}</span>`;
  const trail = `<span class="umr-trail">${p.trailHtml || ""}</span>`;
  // bare: the list is already grouped under a date heading and needs no location.
  if (p.bare) return `<li class="${cls} umr-bare">${home}${mid}${away}</li>`;
  return `<li class="${cls}">${date}${home}${mid}${away}${trail}</li>`;
}
// Legacy alias kept for any callers that haven't migrated yet — same shape.
function matchRowHtml(p) {
  return unifiedMatchRow({
    date: p.date, homeHtml: p.homeHtml, awayHtml: p.awayHtml,
    mid: p.time || "", midCls: p.outcomeCls || "time",
    trailHtml: p.trailing || (p.outcome ? `<span class="umr-outcome ${p.outcomeCls||''}">${escape(p.outcome)}</span>` : ""),
    className: p.className,
  });
}

// Render an Olympia "Olympia X" reference as a click-to-team-page link.
function olympiaLink(team) {
  if (!team) return "Olympia";
  return `<span class="team-link" data-team="${escape(team)}">Olympia ${escape(team)}</span>`;
}
// Render any team mention — links when it's Olympia, plain text otherwise.
function teamLabel(club, team) {
  if ((club || "").toLowerCase() === "olympia") return olympiaLink(team);
  return `${escape(club || "")} ${escape(team || "")}`.trim();
}
// Make a standings-table "Team" cell clickable if it's an Olympia row.
function teamCell(text) {
  const m = (text || "").match(/^Olympia\s+(\S+)/);
  if (m) return olympiaLink(m[1]);
  return escape(text);
}

// Monday-of-week helper for the weekly view. Returns Date (local time, midnight).
function mondayOf(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const day = d.getDay();           // 0=Sun .. 6=Sat
  const shift = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + shift);
  return d;
}
const DAYS_NL = ["Zondag","Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag"];
const MONTHS_NL = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
function formatDateLong(iso) {
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return `${DAYS_NL[dt.getDay()]} ${d} ${MONTHS_NL[m-1]}`;
}
function formatWeekRange(monIso) {
  const [y,m,d] = monIso.split("-").map(Number);
  const start = new Date(y, m-1, d);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  return `${start.getDate()} ${MONTHS_NL[start.getMonth()]} – ${end.getDate()} ${MONTHS_NL[end.getMonth()]} ${end.getFullYear()}`;
}

// ----- Rendering: WEEK -----
function renderWeek() {
  const main = document.getElementById("main");
  if (!state.weekStart) state.weekStart = fmtDateAPI(mondayOf(new Date()));
  const start = new Date(state.weekStart + "T00:00:00");
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    days.push(fmtDateAPI(d));
  }
  const weekEnd = days[6];

  // Pull both completed results AND scheduled games that fall in this week,
  // and tag each so the score column knows whether to render a score or "—".
  const inWeek = iso => iso >= state.weekStart && iso <= weekEnd;
  const past = (state.results  || []).filter(r => inWeek(r.date)).map(r => ({ ...r, kind:"result" }));
  const future = (state.teamGames || []).filter(g => inWeek(g.date)).map(g => ({ ...g, kind:"upcoming" }));
  const all = [...past, ...future].sort((a,b) =>
    a.date.localeCompare(b.date) || a.time.localeCompare(b.time));

  const today = fmtDateAPI(new Date());
  const isCurrent = state.weekStart === fmtDateAPI(mondayOf(new Date()));

  let html = `<div class="week-controls">
    <button id="week-prev" title="Vorige week">◀</button>
    <div class="week-label">
      <div class="week-range">${formatWeekRange(state.weekStart)}</div>
      <div class="week-meta">${past.length} resultaten · ${future.length} geplande wedstrijden</div>
    </div>
    <button id="week-next" title="Volgende week">▶</button>
    <button id="week-today" ${isCurrent ? "disabled" : ""}>Deze week</button>
  </div>
`;

  if (all.length === 0) {
    html += `<div class="empty">Geen wedstrijden deze week.</div>`;
  } else {
    // Date-grouped unified rows — same shape as everywhere else.
    const dateOrder = [...new Set(all.map(x => x.date))].sort();
    for (const d of dateOrder) {
      const dayItems = all.filter(x => x.date === d).sort((a, b) =>
        teamComparator({ code: a.olympiaTeam }, { code: b.olympiaTeam }));
      const isToday = d === fmtDateAPI(new Date());
      html += `<section class="week-day-compact ${isToday?'today':''}">
        <h3>${formatDateLong(d)}${isToday?` <span class="today-tag">vandaag</span>`:""}</h3>
        <ul class="umr-list">`;
      for (const x of dayItems) {
        const homeHtml = x.isHome ? olympiaLink(x.olympiaTeam) : teamLabel(x.opponentClub, x.opponentTeam);
        const awayHtml = x.isHome ? teamLabel(x.opponentClub, x.opponentTeam) : olympiaLink(x.olympiaTeam);
        if (x.kind === "result") {
          const o = computeOutcome(x);
          const score = (x.olympiaScore != null && x.opponentScore != null)
            ? (x.isHome ? `${x.olympiaScore} – ${x.opponentScore}` : `${x.opponentScore} – ${x.olympiaScore}`)
            : "n/g";
          html += unifiedMatchRow({
            bare: true,
            homeHtml, awayHtml,
            mid: score, midCls: o.cls,
            className: `result ${o.cls}`,
          });
        } else {
          // Upcoming: time only. Location lives in Veldbezetting and on the team page.
          html += unifiedMatchRow({
            bare: true,
            homeHtml, awayHtml,
            mid: x.time, midCls: "time",
            className: "upcoming",
          });
        }
      }
      html += `</ul></section>`;
    }
  }
  main.innerHTML = html;

  document.getElementById("week-prev").addEventListener("click", () => shiftWeek(-7));
  document.getElementById("week-next").addEventListener("click", () => shiftWeek(+7));
  document.getElementById("week-today").addEventListener("click", () => {
    state.weekStart = fmtDateAPI(mondayOf(new Date()));
    render();
  });
}
// ======== STATISTIEK ========
// W/G/V over the played results, filtered by period and by group.
//   period: whole season | one speeldag (Mon–Sun week) | free date range
//   cat:    all | youth (U-teams) | adult (D, H, G, JL, T)
//   sex:    all | B (boys, heren, gentlemen) | G (girls, dames, junior ladies) — Trimmers are mixed
//   age:    all | U10, U12, … | D, H, G, JL, T
function statsGroup(code) {
  const m = (code || "").match(/^U(\d+)([BG])/i);
  if (m) return { age:"U"+m[1], sex:m[2].toUpperCase(), youth:true, key:"U"+m[1]+m[2].toUpperCase(),
                  label:`U${m[1]} ${m[2].toUpperCase()==="B"?"Boys":"Girls"}` };
  const c = teamCategory(code);
  const sex = (c==="H"||c==="G"||c==="JM") ? "B" : (c==="D"||c==="JL") ? "G" : "";
  return { age:c, sex, youth:false, key:c, label:(TEAM_GROUP_LABEL[c]||c).replace(" (senior)","") };
}
function tally(list) {
  const t = { n:0, w:0, d:0, l:0 };
  for (const r of list) {
    const o = computeOutcome(r); if (!o.cls) continue;
    t.n++; if (o.cls==="win") t.w++; else if (o.cls==="draw") t.d++; else t.l++;
  }
  return t;
}
const pctOf = (x, n) => n ? Math.round(x / n * 100) : 0;
function wdlBar(t, mini) {
  if (!t.n) return `<div class="wdl ${mini?'mini':''}"></div>`;
  // A label needs room: below 8% the segment is drawn without its number.
  const seg = (cls, x) => x ? `<span class="${cls}" style="flex:${x} 1 0">${mini || pctOf(x,t.n) < 8 ? "" : pctOf(x,t.n)+"%"}</span>` : "";
  return `<div class="wdl ${mini?'mini':''}">${seg("w",t.w)}${seg("d",t.d)}${seg("l",t.l)}</div>`;
}
// rank (optional) · name · full W/G/V bar with percentages · matches played
function statRow(o) {
  const cls = ["srow", o.rank == null ? "norank" : "", o.ours ? "ours" : "", o.attrs ? "click" : ""].filter(Boolean).join(" ");
  return `<li class="${cls}" ${o.attrs || ""}>${o.rank == null ? "" : `<span class="rk">${o.rank}</span>`}<span class="nm">${escape(o.label)}</span>${wdlBar(o.t)}<span class="ct" title="wedstrijden">${o.t.n}</span></li>`;
}
function shortRange(a, b) {
  const A = new Date(a+"T00:00:00"), B = new Date(b+"T00:00:00");
  if (a === b) return `${A.getDate()} ${MONTHS_NL[A.getMonth()]}`;
  if (A.getMonth() === B.getMonth()) return `${A.getDate()}–${B.getDate()} ${MONTHS_NL[B.getMonth()]}`;
  return `${A.getDate()} ${MONTHS_NL[A.getMonth()]} – ${B.getDate()} ${MONTHS_NL[B.getMonth()]}`;
}
// Club comparison — season W/G/V per club, summed over the standings of every pool in
// which Olympia has a team. Costs no extra requests: update.ps1 already embeds those
// standings for the team pages. Only like-for-like: a club's teams in pools without an
// Olympia team are not in here.
//   seg: all | adult | upper (U14, U16, U19) | mid (U10, U11, U12)     sex: all | B | G
function clubOf(teamName) {
  return String(teamName || "").replace(/\s+(U\d+[BG]?|D|H|G|JL|JM|T)\s?-?\s?\d+.*$/i, "").trim();
}
function segOf(g) {
  if (!g.youth) return "adult";
  const n = parseInt(g.age.slice(1), 10);
  return n >= 14 ? "upper" : n >= 10 ? "mid" : "young";
}
function renderClubCompare(main, s) {
  if (!s.seg) s.seg = "all"; if (!s.csex) s.csex = "all";
  const tog = (name, val, label) => `<button data-sf="${name}" data-sv="${val}" class="${s[name]===val?'active':''}">${label}</button>`;

  // One entry per pool (several Olympia teams can share a pool)
  const pools = new Map();
  for (const t of state.teams || []) {
    if (!t.poolId || !t.standing || !Array.isArray(t.standing.rows) || pools.has(t.poolId)) continue;
    pools.set(t.poolId, { g: statsGroup(t.code), st: t.standing });
  }
  const clubs = new Map();
  let poolCount = 0;
  for (const p of pools.values()) {
    if (s.seg !== "all" && segOf(p.g) !== s.seg) continue;
    if (s.csex !== "all" && p.g.sex !== s.csex) continue;
    const c = p.st.columns || [], ix = n => c.indexOf(n);
    const iT = ix("Team"), iP = ix("Played"), iW = ix("Won"), iD = ix("Draw"), iL = ix("Lost");
    if (iT < 0 || iP < 0 || iW < 0 || iD < 0 || iL < 0) continue;
    poolCount++;
    for (const r of p.st.rows) {
      const club = clubOf(r[iT]); if (!club) continue;
      const o = clubs.get(club) || { club, teams:0, n:0, w:0, d:0, l:0 };
      o.teams++; o.n += +r[iP] || 0; o.w += +r[iW] || 0; o.d += +r[iD] || 0; o.l += +r[iL] || 0;
      clubs.set(club, o);
    }
  }
  // Minimum played matches to be ranked: 8 overall, 5 once a filter narrows the pools.
  const CLUB_MIN_PLAYED = (s.seg === "all" && s.csex === "all") ? 8 : 5;
  const rows = [...clubs.values()]
    .filter(o => o.n >= CLUB_MIN_PLAYED || (o.club === "Olympia" && o.n > 0))
    .sort((a, b) => (b.w / b.n) - (a.w / a.n) || b.n - a.n || a.club.localeCompare(b.club));
  const hidden = [...clubs.values()].filter(o => o.n > 0 && o.n < CLUB_MIN_PLAYED && o.club !== "Olympia").length;

  let html = `<div class="stats"><div class="stats-filters">
    <div class="view-toggle">${tog("mode","olympia","Olympia")}${tog("mode","clubs","Clubs")}</div><span class="break"></span>
    <div class="view-toggle">${tog("seg","all","Alle")}${tog("seg","adult","Volwassenen")}${tog("seg","upper","Bovenbouw")}${tog("seg","mid","Middenbouw")}</div>
    <div class="view-toggle">${tog("csex","all","Alle")}${tog("csex","B","Boys")}${tog("csex","G","Girls")}</div>
  </div>`;
  if (!rows.length) {
    html += `<div class="empty">Nog geen gespeelde wedstrijden voor deze selectie.</div></div>`;
  } else {
    const me = rows.findIndex(o => o.club === "Olympia");
    if (me >= 0) {
      const o = rows[me];
      html += `<div class="stats-head"><div class="big">${me+1}<small>van ${rows.length} clubs</small></div><div class="n">${pctOf(o.w,o.n)}% gewonnen · ${o.n} wedstrijden</div></div>`;
    }
    html += `<ul class="srows">` + rows.map((o, i) => statRow({ rank:i+1, label:o.club, t:o, ours:o.club==="Olympia" })).join("") + `</ul>`;
    html += `
      <div class="stats-note">Stand van het seizoen, enkel in de ${poolCount} reeksen waar Olympia speelt.${hidden ? ` ${hidden} club${hidden===1?"":"s"} met minder dan ${CLUB_MIN_PLAYED} wedstrijden niet getoond.` : ""}</div></div>`;
  }
  main.innerHTML = html;
  main.querySelectorAll("[data-sf]").forEach(b => b.addEventListener("click", () => { s[b.dataset.sf] = b.dataset.sv; render(); }));
}

function renderStats() {
  const main = document.getElementById("main");
  const all = (state.results || []).filter(r => computeOutcome(r).cls);
  if (!state.stats) state.stats = { period:"season", week:null, from:"", to:"", cat:"all", sex:"all", age:"all" };
  const s = state.stats;
  if (!s.mode) s.mode = "olympia";
  if (s.mode === "clubs") { renderClubCompare(main, s); return; }

  // Speeldagen = weeks that have at least one played result, newest first
  const weeks = new Map();
  for (const r of all) {
    const k = fmtDateAPI(mondayOf(new Date(r.date+"T00:00:00")));
    const w = weeks.get(k) || { min:r.date, max:r.date };
    if (r.date < w.min) w.min = r.date; if (r.date > w.max) w.max = r.date;
    weeks.set(k, w);
  }
  const weekKeys = [...weeks.keys()].sort().reverse();
  if (!s.week || !weeks.has(s.week)) s.week = weekKeys[0] || null;
  const dates = all.map(r => r.date).sort();
  if (!s.from) s.from = dates[0] || ""; if (!s.to) s.to = dates[dates.length-1] || "";

  // ---- filter ----
  let list = all;
  if (s.period === "week" && s.week) list = list.filter(r => fmtDateAPI(mondayOf(new Date(r.date+"T00:00:00"))) === s.week);
  if (s.period === "range") list = list.filter(r => (!s.from || r.date >= s.from) && (!s.to || r.date <= s.to));
  if (s.cat !== "all") list = list.filter(r => statsGroup(r.olympiaTeam).youth === (s.cat === "youth"));
  if (s.sex !== "all") list = list.filter(r => statsGroup(r.olympiaTeam).sex === s.sex);
  // Age options follow the other filters, so you never pick an empty one.
  const ageSet = [...new Set(list.map(r => statsGroup(r.olympiaTeam).age))]
    .sort((a,b) => TEAM_GROUP_ORDER.indexOf(a) - TEAM_GROUP_ORDER.indexOf(b));
  if (s.age !== "all" && !ageSet.includes(s.age)) s.age = "all";
  if (s.age !== "all") list = list.filter(r => statsGroup(r.olympiaTeam).age === s.age);

  const t = tally(list);
  const tog = (name, val, label) => `<button data-sf="${name}" data-sv="${val}" class="${s[name]===val?'active':''}">${label}</button>`;
  let html = `<div class="stats"><div class="stats-filters">
    <div class="view-toggle">${tog("mode","olympia","Olympia")}${tog("mode","clubs","Clubs")}</div><span class="break"></span>
    <div class="view-toggle">${tog("period","season","Seizoen")}${tog("period","week","Speeldag")}${tog("period","range","Periode")}</div>`;
  if (s.period === "week") html += `<select id="st-week" aria-label="Speeldag">${weekKeys.map(k =>
      `<option value="${k}"${k===s.week?" selected":""}>${shortRange(weeks.get(k).min, weeks.get(k).max)}</option>`).join("")}</select>`;
  if (s.period === "range") html += `<input type="date" id="st-from" value="${s.from}" aria-label="Van"><span class="dash">–</span><input type="date" id="st-to" value="${s.to}" aria-label="Tot">`;
  html += `<span class="break"></span>
    <div class="view-toggle">${tog("cat","all","Alle")}${tog("cat","youth","Jeugd")}${tog("cat","adult","Volwassenen")}</div>
    <div class="view-toggle">${tog("sex","all","Alle")}${tog("sex","B","Boys")}${tog("sex","G","Girls")}</div>
    <select id="st-age" aria-label="Leeftijdsgroep"><option value="all">Alle leeftijden</option>${ageSet.map(a =>
      `<option value="${a}"${a===s.age?" selected":""}>${escape((TEAM_GROUP_LABEL[a]||a).replace(" (senior)",""))}</option>`).join("")}</select>
  </div>`;

  if (!t.n) {
    html += `<div class="empty">Geen gespeelde wedstrijden voor deze selectie.</div></div>`;
  } else {
    html += `<div class="stats-head"><div class="big">${pctOf(t.w,t.n)}%<small>gewonnen</small></div><div class="n">${t.n} wedstrijd${t.n===1?"":"en"}</div></div>
      ${wdlBar(t)}
      <div class="wdl-key"><span><b>${t.w}</b> gewonnen</span><span><b>${t.d}</b> gelijk</span><span><b>${t.l}</b> verloren</span></div>`;

    // Breakdown: by group, or by team once a single group is selected
    const groupKeys = new Set(list.map(r => statsGroup(r.olympiaTeam).key));
    const byTeam = groupKeys.size === 1;
    const rows = new Map();
    for (const r of list) {
      const g = statsGroup(r.olympiaTeam);
      const k = byTeam ? r.olympiaTeam : g.key;
      if (!rows.has(k)) rows.set(k, { key:k, label: byTeam ? r.olympiaTeam : g.label, g, games:[] });
      rows.get(k).games.push(r);
    }
    const sorted = [...rows.values()].sort((a,b) => teamComparator({code: byTeam?a.key:a.games[0].olympiaTeam}, {code: byTeam?b.key:b.games[0].olympiaTeam}) || a.label.localeCompare(b.label));
    if (sorted.length > 1 || byTeam) {
      html += `<ul class="srows">` + sorted.map(row => statRow({
        label: row.label, t: tally(row.games),
        attrs: byTeam ? `data-st-team="${escape(row.key)}"` : `data-st-age="${row.g.age}" data-st-sex="${row.g.sex}"`,
      })).join("") + `</ul>`;
    }
    // Results without a filled-in score, under the same filters
    const skipped = (state.results || []).filter(r => {
      if (computeOutcome(r).cls) return false;
      if (s.period === "week" && fmtDateAPI(mondayOf(new Date(r.date+"T00:00:00"))) !== s.week) return false;
      if (s.period === "range" && ((s.from && r.date < s.from) || (s.to && r.date > s.to))) return false;
      const g = statsGroup(r.olympiaTeam);
      if (s.cat !== "all" && g.youth !== (s.cat === "youth")) return false;
      if (s.sex !== "all" && g.sex !== s.sex) return false;
      if (s.age !== "all" && g.age !== s.age) return false;
      return true;
    }).length;
    if (skipped) html += `<div class="stats-note">${skipped} wedstrijd${skipped===1?"":"en"} zonder ingevulde score niet meegeteld.</div>`;
    html += `</div>`;
  }
  main.innerHTML = html;

  main.querySelectorAll("[data-sf]").forEach(b => b.addEventListener("click", () => { s[b.dataset.sf] = b.dataset.sv; render(); }));
  const on = (id, fn) => { const el = main.querySelector(id); if (el) el.addEventListener("change", e => { fn(e.target.value); render(); }); };
  on("#st-week", v => s.week = v); on("#st-from", v => s.from = v); on("#st-to", v => s.to = v); on("#st-age", v => s.age = v);
  main.querySelectorAll("[data-st-age]").forEach(tr => tr.addEventListener("click", () => {
    s.age = tr.dataset.stAge; s.sex = tr.dataset.stSex || "all"; render();
  }));
  main.querySelectorAll("[data-st-team]").forEach(tr => tr.addEventListener("click", () => navigateToTeam(tr.dataset.stTeam)));
}

function shiftWeek(deltaDays) {
  const d = new Date(state.weekStart + "T00:00:00");
  d.setDate(d.getDate() + deltaDays);
  state.weekStart = fmtDateAPI(d);
  render();
}

// ----- Rendering: TEAMS -----
const TEAM_GROUP_ORDER = ["D", "H", "JL", "JM", "G", "T", "U19", "U16", "U14", "U12", "U11", "U10", "U9", "U8", "U7"];
const TEAM_GROUP_LABEL = {
  D:"Dames (senior)", H:"Heren (senior)",
  JL:"Junior Ladies", JM:"Junior Men",
  G:"Gentlemen", T:"Trimmers",
  U19:"U19", U16:"U16", U14:"U14", U12:"U12", U11:"U11", U10:"U10", U9:"U9", U8:"U8", U7:"U7",
};
function teamCategory(code) {
  if (!code) return "?";
  const u = code.match(/^(U\d+)/); if (u) return u[1];
  if (code.startsWith("JL") || code.startsWith("JM")) return code.slice(0, 2);
  return code.charAt(0);
}
function teamComparator(a, b) {
  const ca = teamCategory(a.code), cb = teamCategory(b.code);
  const oa = TEAM_GROUP_ORDER.indexOf(ca); const ob = TEAM_GROUP_ORDER.indexOf(cb);
  if (oa !== ob) return (oa < 0 ? 999 : oa) - (ob < 0 ? 999 : ob);
  return a.code.localeCompare(b.code, undefined, { numeric:true });
}
function computeOutcome(r) {
  if (r.olympiaScore == null || r.opponentScore == null) return { cls:"", letter:"" };
  if (r.olympiaScore >  r.opponentScore) return { cls:"win",  letter:"W" };
  if (r.olympiaScore <  r.opponentScore) return { cls:"loss", letter:"V" };
  return { cls:"draw", letter:"G" };
}

function renderTeams() {
  const main = document.getElementById("main");
  const teams = state.teams || [];
  if (teams.length === 0) {
    main.innerHTML = `<div class="empty">Geen team-data — run <code>update.ps1</code> opnieuw.</div>`;
    return;
  }
  // Default to favorite team if set; otherwise first team in the list.
  if (!state.selectedTeam || !teams.find(t => t.code === state.selectedTeam)) {
    state.selectedTeam = state.favoriteTeam && teams.find(t => t.code === state.favoriteTeam)
      ? state.favoriteTeam
      : teams[0].code;
  }
  const team = teams.find(t => t.code === state.selectedTeam);
  const isFav = state.favoriteTeam === team.code;

  // Dropdown grouped by category
  const sorted = [...teams].sort(teamComparator);
  const grouped = new Map();
  for (const t of sorted) {
    const c = teamCategory(t.code);
    if (!grouped.has(c)) grouped.set(c, []);
    grouped.get(c).push(t);
  }
  const optgroups = [];
  for (const cat of TEAM_GROUP_ORDER) {
    if (!grouped.has(cat)) continue;
    const opts = grouped.get(cat).map(t =>
      `<option value="${escape(t.code)}" ${t.code === team.code ? "selected" : ""}>${escape(t.code)}</option>`
    ).join("");
    optgroups.push(`<optgroup label="${escape(TEAM_GROUP_LABEL[cat] || cat)}">${opts}</optgroup>`);
  }

  let html = `<div class="team-controls">
    <label for="team-select">Team</label>
    <select id="team-select">${optgroups.join("")}</select>
    <div class="team-comp">${escape(cleanDivision(team.division))}</div>
    <button id="fav-toggle" class="fav-toggle ${isFav?'active':''}" type="button" title="${isFav?'Verwijder uit favorieten':'Maak favoriet team'}">
      <span class="fav-icon">${isFav ? '★' : '☆'}</span><span class="fav-label"> Favoriet</span>
    </button>
  </div>`;

  // Hero: Next match card — biggest piece of info on the team page
  const nextMatch = (state.teamGames || []).find(g => g.olympiaTeam === team.code);
  if (nextMatch) {
    const homeHtml = nextMatch.isHome ? `<strong>Olympia ${escape(nextMatch.olympiaTeam)}</strong>` : `${escape(nextMatch.opponentClub)} ${escape(nextMatch.opponentTeam)}`;
    const awayHtml = nextMatch.isHome ? `${escape(nextMatch.opponentClub)} ${escape(nextMatch.opponentTeam)}` : `<strong>Olympia ${escape(nextMatch.olympiaTeam)}</strong>`;
    let locHtml = "";
    if (nextMatch.isHome && nextMatch.fieldCode) {
      locHtml = `<span class="field-badge" data-nav-date="${escape(nextMatch.date)}" data-nav-time="${escape(nextMatch.time)}">${escape(fieldLabel(nextMatch.fieldCode, nextMatch.subpath))} <span class="field-arrow">→</span></span>`;
    } else if (!nextMatch.isHome) {
      const mapQ = encodeURIComponent(`${nextMatch.opponentClub} hockey club Belgium`);
      locHtml = `<a class="map-link" href="https://www.google.com/maps/search/?api=1&query=${mapQ}" target="_blank" rel="noopener">UIT bij ${escape(nextMatch.opponentClub)} <span class="map-icon">↗</span></a>`;
    } else {
      locHtml = `<span class="loc-tag home">thuis</span>`;
    }
    html += `<div class="next-match-hero">
      <div class="hero-tag">Volgende wedstrijd</div>
      <div class="hero-teams">${homeHtml} <span class="hero-vs">vs</span> ${awayHtml}</div>
      <div class="hero-meta">
        <span>${formatDateLong(nextMatch.date)}</span>
        <span class="sep">·</span>
        <span>${escape(nextMatch.time)}</span>
        <span class="sep">·</span>
        ${locHtml}
      </div>
    </div>`;
  }

  // Standings + this-week-in-pool side-by-side (stacks on narrow viewports)
  // U7-U9: no scores are kept, so there is never a standing or a results round to show.
  const noScores = /^U[789][BG]/i.test(team.code);
  html += `<section class="team-section pool-row"${noScores ? ' style="display:none"' : ''}>`;
  html += `<div class="pool-col standing-col"><h2>Rangschikking</h2>`;
  if (team.standing && team.standing.rows && team.standing.rows.length > 0) {
    // Source columns from API: Rank, Team, Played, Won, Lost, Draw, Own Goals, Against Goals, Points
    // Display order: Rank, Team, P, W, D, L, Pt, Ds, +, - (with Ds = own - against computed here).
    const headers = ["#", "Team", "P", "W", "D", "L", "Pt", "Ds", "+", "-"];
    const myLabel = `Olympia ${team.code}`;
    html += `<div class="standing-wrap"><table class="standing-table">
      <thead><tr>${headers.map((h, i) => `<th class="col-${i}">${escape(h)}</th>`).join("")}</tr></thead>
      <tbody>${team.standing.rows.map(row => {
        const own = parseInt(row[6], 10) || 0;
        const against = parseInt(row[7], 10) || 0;
        const ds = own - against;
        const cells = [
          row[0],                                  // Rank
          row[1],                                  // Team (may be Olympia X — clickable)
          row[2],                                  // P
          row[3],                                  // W
          row[5],                                  // D
          row[4],                                  // L
          row[8],                                  // Pt
          (ds > 0 ? "+" : "") + ds,                // Ds
          row[6],                                  // +
          row[7],                                  // -
        ];
        const isOurs = (row[1] || "").trim() === myLabel;
        return `<tr class="${isOurs ? "ours" : ""}">${cells.map((cell, i) => {
          const cls = i === 0 ? "rank" : (i === 1 ? "team" : "num");
          const content = (i === 1) ? teamCell(cell) : escape(String(cell));
          return `<td class="${cls} col-${i}">${content}</td>`;
        }).join("")}</tr>`;
      }).join("")}</tbody>
    </table></div>`;
  } else {
    html += `<div class="empty-section">Geen rangschikking beschikbaar voor deze competitie.</div>`;
  }
  html += `</div>`;  // .standing-col

  // Pool-wide games this calendar week (Mon-Sun) — all teams in the competition,
  // not just Olympia. Shows results for past days and scheduled matches for upcoming.
  html += `<div class="pool-col pool-week-col"><h2>Vorige speeldag uitslagen</h2>`;
  const poolList = (state.poolGames && team.poolId) ? (state.poolGames[team.poolId] || []) : [];
  if (poolList.length === 0) {
    html += `<div class="empty-section">Geen poule-wedstrijden gevonden.</div>`;
  } else {
    // Strict "prior calendar week" — Mon-Sun of the week BEFORE the one we're currently in.
    // If today is in the same week as a matchday, those games still count (they were
    // played "this week" if it's after today, etc.). We only want the fully-completed
    // previous week.
    const thisMon = mondayOf(new Date());
    const priorMon = new Date(thisMon); priorMon.setDate(thisMon.getDate() - 7);
    const priorSun = new Date(thisMon); priorSun.setDate(thisMon.getDate() - 1);
    const priorMonIso = fmtDateAPI(priorMon);
    const priorSunIso = fmtDateAPI(priorSun);
    const recent = poolList
      .filter(p => p.isPast && p.date >= priorMonIso && p.date <= priorSunIso)
      .sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
    if (recent.length === 0) {
      html += `<div class="empty-section">Geen uitslagen vorige week (${priorMon.getDate()}/${priorMon.getMonth()+1} – ${priorSun.getDate()}/${priorSun.getMonth()+1}).</div>`;
    } else {
      html += `<ul class="umr-list">`;
      for (const p of recent) {
        const isOlympiaHome = p.homeClub === "Olympia";
        const isOlympiaAway = p.awayClub === "Olympia";
        const isOurMatch = (isOlympiaHome && p.homeTeam === team.code) || (isOlympiaAway && p.awayTeam === team.code);
        const home = isOlympiaHome ? olympiaLink(p.homeTeam) : `${escape(p.homeClub)} ${escape(p.homeTeam)}`;
        const away = isOlympiaAway ? olympiaLink(p.awayTeam) : `${escape(p.awayClub)} ${escape(p.awayTeam)}`;
        const score = (p.homeScore != null && p.awayScore != null)
          ? `${p.homeScore} – ${p.awayScore}` : "n/g";
        // Color OUR row's score pill by outcome — others stay neutral
        let midCls = "";
        if (isOurMatch && p.homeScore != null && p.awayScore != null) {
          const olympiaScore = isOlympiaHome ? p.homeScore : p.awayScore;
          const opponentScore = isOlympiaHome ? p.awayScore : p.homeScore;
          midCls = olympiaScore > opponentScore ? "win"
                 : olympiaScore < opponentScore ? "loss" : "draw";
        }
        html += unifiedMatchRow({
          date: formatDDMM(p.date),
          homeHtml: home, awayHtml: away,
          mid: score, midCls,
          trailHtml: "",
          className: isOurMatch ? "our-match" : "",
        });
      }
      html += `</ul>`;
    }
  }
  html += `</div>`;  // .pool-week-col
  html += `</section>`;  // .pool-row

  // Upcoming matches first (teamGames — sorted ascending by update.ps1)
  const upcoming = (state.teamGames || []).filter(g => g.olympiaTeam === team.code);
  html += `<section class="team-section">
    <h2>Komende wedstrijden</h2>`;
  if (upcoming.length === 0) {
    html += `<div class="empty-section">Geen geplande wedstrijden.</div>`;
  } else {
    html += `<ul class="umr-list">`;
    for (const g of upcoming.slice(0, 12)) {
      const homeHtml = g.isHome ? `<strong>${olympiaLink(g.olympiaTeam)}</strong>` : `${escape(g.opponentClub)} ${escape(g.opponentTeam)}`;
      const awayHtml = g.isHome ? `${escape(g.opponentClub)} ${escape(g.opponentTeam)}` : `<strong>${olympiaLink(g.olympiaTeam)}</strong>`;
      let trailHtml;
      if (g.isHome && g.fieldCode) {
        trailHtml = `<span class="field-badge" data-nav-date="${escape(g.date)}" data-nav-time="${escape(g.time)}" title="Open in Veldbezetting">${escape(fieldLabel(g.fieldCode, g.subpath))} <span class="field-arrow">→</span></span>`;
      } else if (g.isHome) {
        trailHtml = `<span class="loc-tag home">thuis</span>`;
      } else {
        const mapQ = encodeURIComponent(`${g.opponentClub} hockey club Belgium`);
        trailHtml = `<a class="loc-tag away map-loc" href="https://www.google.com/maps/search/?api=1&query=${mapQ}" target="_blank" rel="noopener" title="Open locatie in Google Maps">uit ↗</a>`;
      }
      html += unifiedMatchRow({
        date: formatDDMM(g.date),
        homeHtml, awayHtml,
        mid: g.time, midCls: "time",
        trailHtml,
        className: "upcoming",
      });
    }
    html += `</ul>`;
  }
  html += `</section>`;

  // Last matches (results — already sorted by update.ps1 most-recent-first)
  const lastMatches = (state.results || []).filter(r => r.olympiaTeam === team.code).slice(0, 10);
  html += `<section class="team-section">
    <h2>Laatste wedstrijden</h2>`;
  if (lastMatches.length === 0) {
    html += `<div class="empty-section">Geen recente wedstrijden gevonden.</div>`;
  } else {
    html += `<ul class="umr-list">`;
    for (const r of lastMatches) {
      const o = computeOutcome(r);
      const homeHtml = r.isHome ? `<strong>${olympiaLink(r.olympiaTeam)}</strong>` : `${escape(r.opponentClub)} ${escape(r.opponentTeam)}`;
      const awayHtml = r.isHome ? `${escape(r.opponentClub)} ${escape(r.opponentTeam)}` : `<strong>${olympiaLink(r.olympiaTeam)}</strong>`;
      const score = (r.olympiaScore != null && r.opponentScore != null)
        ? (r.isHome ? `${r.olympiaScore} – ${r.opponentScore}` : `${r.opponentScore} – ${r.olympiaScore}`)
        : "n/g";
      html += unifiedMatchRow({
        date: formatDDMM(r.date),
        homeHtml, awayHtml,
        mid: score, midCls: o.cls,
        trailHtml: "",   // colored score pill already conveys W/V/G
        className: `result ${o.cls}`,
      });
    }
    html += `</ul>`;
  }
  main.innerHTML = html;
  const favBtn = document.getElementById("fav-toggle");
  if (favBtn) favBtn.addEventListener("click", () => {
    setFavoriteTeam(state.favoriteTeam === team.code ? null : team.code);
    render();
  });
  document.getElementById("team-select").addEventListener("change", e => {
    state.selectedTeam = e.target.value;
    render();
  });
}

// ----- State -----
const FAV_TEAM_KEY = "olympia_fav_team";
const state = {
  date: fmtDateAPI(new Date()),
  view: "layout",        // landing page = Veldbezetting
  fieldGames: [],
  teamGames: [],
  results: [],
  teams: [],
  poolGames: {},
  activeSlot: null,
  selectedTeam: null,
  weekStart: null,
  // Veldbezetting state: mode = "all" (3-col) | "one" (1-col), selectedField = "1"|"2"|"5"
  veldbezettingMode: null,
  selectedField: null,
  favoriteTeam: (typeof localStorage !== "undefined" ? localStorage.getItem(FAV_TEAM_KEY) : null) || null,
  updated: null,
};

function setFavoriteTeam(code) {
  state.favoriteTeam = code || null;
  try {
    if (code) localStorage.setItem(FAV_TEAM_KEY, code);
    else      localStorage.removeItem(FAV_TEAM_KEY);
  } catch {}
}

function render() {
  renderFavoriteChip();
  if (state.view === "teams") { renderTeams(); return; }
  if (state.view === "week")  { renderWeek();  return; }
  if (state.view === "stats") { renderStats(); return; }
  // "layout" tab now means Veldbezetting (mini-map + slider + timeline)
  renderVeldbezetting();
}

// Favorite-team chip: a small banner under the header. Click it to jump
// straight to that team's page; tap ✕ to clear. Hidden when no favorite is set.
function renderFavoriteChip() {
  let bar = document.getElementById("fav-bar");
  if (!bar) {
    bar = document.createElement("div");
    bar.id = "fav-bar";
    document.querySelector("header").after(bar);
  }
  if (!state.favoriteTeam || SITE === "data") { bar.innerHTML = ""; bar.style.display = "none"; return; }
  bar.style.display = "";
  bar.innerHTML = `<button class="fav-chip" type="button" title="Open favoriet team">
      <span class="fav-star">★</span>
      <span class="fav-text">Favoriet: ${escape(state.favoriteTeam)}</span>
    </button>
    <button class="fav-clear" type="button" title="Verwijder favoriet">✕</button>`;
  bar.querySelector(".fav-chip").addEventListener("click", () => navigateToTeam(state.favoriteTeam));
  bar.querySelector(".fav-clear").addEventListener("click", () => { setFavoriteTeam(null); renderFavoriteChip(); });
}

// Navigate to a team page from anywhere a team name was clicked.
function navigateToTeam(code) {
  if (SITE === "data") return;   // OlympiaData has no Teams view
  state.selectedTeam = code;
  state.view = "teams";
  document.querySelectorAll("header .tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.view === "teams"));
  render();
}
// Navigate to the field-layout view for a specific date + time slot. Used when a
// user clicks a "Veld X" badge on a home game in the Teams view.
function navigateToFieldView(date, time) {
  state.date = date;
  state.view = "layout";
  state.activeSlot = time;
  const di = document.getElementById("date");
  if (di) di.value = date;
  document.querySelectorAll("header .tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.view === "layout"));
