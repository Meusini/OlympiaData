function pickDefaultSlot(slots) {
  const today = new Date(state.date + "T00:00:00");
  const now = new Date();
  if (today.toDateString() === now.toDateString()) {
    const hhmm = now.toTimeString().slice(0,5);
    return slots.find(s => s >= hhmm) || slots[slots.length - 1];
  }
  return slots[0];
}

function renderLegend() {
  const items = [
    ["U7","var(--u7)"],["U8","var(--u8)"],["U9","var(--u9)"],["U10","var(--u10)"],
    ["U11","var(--u11)"],["U12","var(--u12)"],["U14","var(--u14)"],["U16","var(--u16)"],
    ["U19","var(--u19)"],["Senior (D/H)","var(--senior)"],["Gentlemen","var(--gent)"],
    ["Junior","var(--junior)"],["Trimmers","var(--trim)"],["Keepers","var(--gk)"],["Ander","var(--other)"],
  ];
  return `<div class="legend">${items.map(([n,c]) =>
    `<span class="chip"><span class="sw" style="background:${c}"></span>${n}</span>`
  ).join("")}<span class="chip"><span class="sw dashed"></span>Training (gestreept)</span></div>`;
}

function shortDiv(div) {
  return cleanDivision(div).replace(/\s*-\s*HV.*$/, "").replace(/Belgian League\s*/,"BL ").slice(0,42);
}
// Strip the literal " (2)" segment Sportlink injects into youth division names
// ("U10 Boys (2) - HV 1 B") — meaningless to club users, just visual noise.
function cleanDivision(div) {
  if (!div) return "";
  return div.replace(/\s*\(2\)\s*/g, " ").replace(/\s+/g, " ").trim();
}
function escape(s) {
  return (s || "").replace(/[<>&"]/g, ch => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[ch]));
}
function formatDDMM(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}`;
}

// Unified match-row markup — same shape for every match list (Resultaten, Komende, Laatste,
// Vorige speeldag uitslagen, Veldverdeling games-list). Five columns:
//   date | homeTeam (right-aligned) | mid pill (score / time) | awayTeam (left-aligned) | trail
// The mid pill colors itself by outcome (win/loss/draw) for past results, or sits as a quiet
// time chip for upcoming games. Trail is outcome letter (past), or field-badge / map link (upcoming).
function unifiedMatchRow(p) {
  const cls = p.className ? `umr ${p.className}` : "umr";
  const date = `<span class="umr-date">${p.date ? escape(p.date) : ""}</span>`;
  const home = `<span class="umr-home">${p.homeHtml || ""}</span>`;
  const midCls = p.midCls ? `umr-mid ${p.midCls}` : "umr-mid";
  const mid  = `<span class="${midCls}">${p.mid ? escape(p.mid) : ""}</span>`;
  const away = `<span class="umr-away">${p.awayHtml || ""}</span>`;
  const trail = `<span class="umr-trail">${p.trailHtml || ""}</span>`;
  // bare: the list is already grouped under a date heading and needs no location.
  if (p.bare) return `<li class="${cls} umr-bare">${home}${mid}${away}</li>`;
  return `<li class="${cls}">${date}${home}${mid}${away}${trail}</li>`;
}
// Legacy alias kept for any callers that haven't migrated yet — same shape.
function matchRowHtml(p) {
  return unifiedMatchRow({
    date: p.date, homeHtml: p.homeHtml, awayHtml: p.awayHtml,
    mid: p.time || "", midCls: p.outcomeCls || "time",
    trailHtml: p.trailing || (p.outcome ? `<span class="umr-outcome ${p.outcomeCls||''}">${escape(p.outcome)}</span>` : ""),
    className: p.className,
  });
}

// ----- Seasons -----
// Indoor and outdoor are separate teams in separate pools ("U10B-1" plays both). A team's key is
// its code for outdoor and "code|indoor" for indoor; rows without a season (older data) are outdoor.
const seasonOf = x => (x && x.season === "indoor") ? "indoor" : "outdoor";
const teamKeyOf = (code, season) => season === "indoor" ? code + "|indoor" : code;
const keyCode = k => String(k || "").split("|")[0];
const keySeason = k => String(k || "").endsWith("|indoor") ? "indoor" : "outdoor";
const SEASON_KEY = "olympia_season";
const inSeason = x => state.season === "all" || seasonOf(x) === state.season;
// The season being played now: indoor between the first and last indoor match in the data.
function currentSeason() {
  const today = fmtDateAPI(new Date());
  const ind = [...(state.results || []), ...(state.teamGames || [])].filter(g => seasonOf(g) === "indoor").map(g => g.date).sort();
  return ind.length && today >= ind[0] && today <= ind[ind.length - 1] ? "indoor" : "outdoor";
}
function seasonTag(x) { return state.season === "all" && SITE === "calendar" ? ` <span class="season-tag ${seasonOf(x)}">${seasonOf(x) === "indoor" ? "Indoor" : "Outdoor"}</span>` : ""; }

// Map search for a match location. Indoor matches are played in sports halls, so hockey.be's venue
// ("Ath. Keerbergen", "BRAX - Indoor 4") beats the opponent's club name.
function mapUrl(g) {
  const q = seasonOf(g) === "indoor" && g.venue ? `${g.venue} ${g.isHome ? "" : g.opponentClub} Belgium` : `${g.opponentClub} hockey club Belgium`;
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q.replace(/s+/g, " ").trim());
}

// Render an Olympia "Olympia X" reference as a click-to-team-page link.
function olympiaLink(team, season) {
  if (!team) return "Olympia";
  return `<span class="team-link" data-team="${escape(teamKeyOf(team, season))}">Olympia ${escape(team)}</span>`;
}
// Render any team mention — links when it's Olympia, plain text otherwise.
function teamLabel(club, team) {
  if ((club || "").toLowerCase() === "olympia") return olympiaLink(team);
  return `${escape(club || "")} ${escape(team || "")}`.trim();
}
// Make a standings-table "Team" cell clickable if it's an Olympia row.
function teamCell(text, season) {
  const m = (text || "").match(/^Olympia\s+(\S+)/);
  if (m) return olympiaLink(m[1], season);
  return escape(text);
}

// Monday-of-week helper for the weekly view. Returns Date (local time, midnight).
function mondayOf(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const day = d.getDay();           // 0=Sun .. 6=Sat
  const shift = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + shift);
  return d;
}
const DAYS_NL = ["Zondag","Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag"];
const MONTHS_NL = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const DAYS_EN = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function formatDateLong(iso) {
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return `${DAYS_EN[dt.getDay()]} ${d} ${MONTHS_EN[m-1]}`;
}
function formatWeekRange(monIso) {
  const [y,m,d] = monIso.split("-").map(Number);
  const start = new Date(y, m-1, d);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  return `${start.getDate()} ${MONTHS_EN[start.getMonth()]} – ${end.getDate()} ${MONTHS_EN[end.getMonth()]} ${end.getFullYear()}`;
}

// ----- Rendering: WEEK -----
function renderWeek() {
  const main = document.getElementById("main");
  if (!state.weekStart) state.weekStart = fmtDateAPI(mondayOf(new Date()));
  const start = new Date(state.weekStart + "T00:00:00");
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    days.push(fmtDateAPI(d));
  }
  const weekEnd = days[6];

  // Pull both completed results AND scheduled games that fall in this week,
  // and tag each so the score column knows whether to render a score or "—".
  const inWeek = iso => iso >= state.weekStart && iso <= weekEnd;
  const past = (state.results  || []).filter(r => inWeek(r.date) && inSeason(r)).map(r => ({ ...r, kind:"result" }));
  const future = (state.teamGames || []).filter(g => inWeek(g.date) && inSeason(g)).map(g => ({ ...g, kind:"upcoming" }));
  const all = [...past, ...future].sort((a,b) =>
    a.date.localeCompare(b.date) || a.time.localeCompare(b.time));

  const today = fmtDateAPI(new Date());
  const isCurrent = state.weekStart === fmtDateAPI(mondayOf(new Date()));

  let html = `<div class="week-controls">
    <button id="week-prev" title="Previous week">◀</button>
    <div class="week-label">
      <div class="week-range">${formatWeekRange(state.weekStart)}</div>
      <div class="week-meta">${past.length} result${past.length===1?"":"s"} · ${future.length} scheduled match${future.length===1?"":"es"}</div>
    </div>
    <button id="week-next" title="Next week">▶</button>
    <button id="week-today" ${isCurrent ? "disabled" : ""}>This week</button>
  </div>
`;

  if (all.length === 0) {
    html += `<div class="empty">No matches this week.</div>`;
  } else {
    // Date-grouped unified rows — same shape as everywhere else.
    const dateOrder = [...new Set(all.map(x => x.date))].sort();
    for (const d of dateOrder) {
      const dayItems = all.filter(x => x.date === d).sort((a, b) =>
        teamComparator({ code: a.olympiaTeam }, { code: b.olympiaTeam }));
      const isToday = d === fmtDateAPI(new Date());
      html += `<section class="week-day-compact ${isToday?'today':''}">
        <h3>${formatDateLong(d)}${isToday?` <span class="today-tag">today</span>`:""}</h3>
        <ul class="umr-list">`;
      for (const x of dayItems) {
        const homeHtml = x.isHome ? olympiaLink(x.olympiaTeam, seasonOf(x)) + seasonTag(x) : teamLabel(x.opponentClub, x.opponentTeam);
        const awayHtml = x.isHome ? teamLabel(x.opponentClub, x.opponentTeam) : olympiaLink(x.olympiaTeam, seasonOf(x)) + seasonTag(x);
        if (x.kind === "result") {
          const o = computeOutcome(x);
          const score = (x.olympiaScore != null && x.opponentScore != null)
            ? (x.isHome ? `${x.olympiaScore} – ${x.opponentScore}` : `${x.opponentScore} – ${x.olympiaScore}`)
            : "n/p";
          html += unifiedMatchRow({
            bare: true,
            homeHtml, awayHtml,
            mid: score, midCls: o.cls,
            className: `result ${o.cls} ${x.isHome ? "ol-home" : "ol-away"}`,
          });
        } else {
          // Upcoming: time only. Location lives in Veldbezetting and on the team page.
          html += unifiedMatchRow({
            bare: true,
            homeHtml, awayHtml,
            mid: x.time, midCls: "time",
            className: "upcoming",
          });
        }
      }
      html += `</ul></section>`;
    }
  }
  main.innerHTML = html;

  document.getElementById("week-prev").addEventListener("click", () => shiftWeek(-7));
  document.getElementById("week-next").addEventListener("click", () => shiftWeek(+7));
  document.getElementById("week-today").addEventListener("click", () => {
    state.weekStart = fmtDateAPI(mondayOf(new Date()));
    render();
  });
}
// ======== STATISTIEK ========
// W/G/V over the played results, filtered by period and by group.
//   period: whole season | one speeldag (Mon–Sun week) | free date range
//   cat:    all | youth (U-teams) | adult (D, H, G, JL, T)
//   sex:    all | B (boys, heren, gentlemen) | G (girls, dames, junior ladies) — Trimmers are mixed
//   age:    all | U10, U12, … | D, H, G, JL, T
function statsGroup(code) {
  const m = (code || "").match(/^U(\d+)([BG])/i);
  if (m) return { age:"U"+m[1], sex:m[2].toUpperCase(), youth:true, key:"U"+m[1]+m[2].toUpperCase(),
                  label:`U${m[1]} ${m[2].toUpperCase()==="B"?"Boys":"Girls"}` };
  const c = teamCategory(code);
  const sex = (c==="H"||c==="G"||c==="JM") ? "B" : (c==="D"||c==="JL") ? "G" : "";
  return { age:c, sex, youth:false, key:c, label:(TEAM_GROUP_LABEL[c]||c).replace(" (senior)","") };
}
function tally(list) {
  const t = { n:0, w:0, d:0, l:0 };
  for (const r of list) {
    const o = computeOutcome(r); if (!o.cls) continue;
    t.n++; if (o.cls==="win") t.w++; else if (o.cls==="draw") t.d++; else t.l++;
  }
  return t;
}
const pctOf = (x, n) => n ? Math.round(x / n * 100) : 0;
function wdlBar(t, mini) {
  if (!t.n) return `<div class="wdl ${mini?'mini':''}"></div>`;
  // A label needs room: below 8% the segment is drawn without its number.
  const seg = (cls, x) => x ? `<span class="${cls}" style="flex:${x} 1 0">${mini || pctOf(x,t.n) < 8 ? "" : pctOf(x,t.n)+"%"}</span>` : "";
  return `<div class="wdl ${mini?'mini':''}">${seg("w",t.w)}${seg("d",t.d)}${seg("l",t.l)}</div>`;
}
// rank (optional) · name · full W/G/V bar with percentages · matches played
function statRow(o) {
  const cls = ["srow", o.rank == null ? "norank" : "", o.ours ? "ours" : "", o.attrs ? "click" : ""].filter(Boolean).join(" ");
  return `<li class="${cls}" ${o.attrs || ""}>${o.rank == null ? "" : `<span class="rk">${o.rank}</span>`}<span class="nm">${escape(o.label)}</span>${wdlBar(o.t)}<span class="ct" title="wedstrijden">${o.t.n}</span></li>`;
}
function shortRange(a, b) {
  const A = new Date(a+"T00:00:00"), B = new Date(b+"T00:00:00");
  if (a === b) return `${A.getDate()} ${MONTHS_NL[A.getMonth()]}`;
  if (A.getMonth() === B.getMonth()) return `${A.getDate()}–${B.getDate()} ${MONTHS_NL[B.getMonth()]}`;
  return `${A.getDate()} ${MONTHS_NL[A.getMonth()]} – ${B.getDate()} ${MONTHS_NL[B.getMonth()]}`;
}
// Club comparison — season W/G/V per club, summed over the standings of every pool in
// which Olympia has a team. Costs no extra requests: update.ps1 already embeds those
// standings for the team pages. Only like-for-like: a club's teams in pools without an
// Olympia team are not in here.
//   seg: all | adult | upper (U14, U16, U19) | mid (U10, U11, U12)     sex: all | B | G
function clubOf(teamName) {
  return String(teamName || "").replace(/\s+(U\d+[BG]?|D|H|G|JL|JM|T)\s?-?\s?\d+.*$/i, "").trim();
}
function segOf(g) {
  if (!g.youth) return "adult";
  const n = parseInt(g.age.slice(1), 10);
  return n >= 14 ? "upper" : n >= 10 ? "mid" : "young";
}
function renderClubCompare(main, s) {
  if (!s.seg) s.seg = "all"; if (!s.csex) s.csex = "all";
  const tog = (name, val, label) => `<button data-sf="${name}" data-sv="${val}" class="${s[name]===val?'active':''}">${label}</button>`;

  const A = state.allClubs;
  const clubs = new Map();
  let poolCount = 0;
  if (A) {
    // OlympiaData: every outdoor league pool in Belgium, pre-summed per club / segment / gender.
    for (const [club, seg, sex, n, w, d, l, teams, kind] of A.rows) {
      if (s.season !== "all" && (kind || "outdoor") !== s.season) continue;
      if (s.seg !== "all" && seg !== s.seg) continue;
      if (s.csex !== "all" && sex !== s.csex) continue;
      const o = clubs.get(club) || { club, teams:0, n:0, w:0, d:0, l:0 };
      o.teams += teams; o.n += n; o.w += w; o.d += d; o.l += l;
      clubs.set(club, o);
    }
    poolCount = s.season === "all" ? A.pools : ((A.poolsByKind || {})[s.season] || 0);
  } else {
  // One entry per pool (several Olympia teams can share a pool)
  const pools = new Map();
  for (const t of state.teams || []) {
    if (!t.poolId || !t.standing || !Array.isArray(t.standing.rows) || pools.has(t.poolId)) continue;
    pools.set(t.poolId, { g: statsGroup(t.code), st: t.standing });
  }
  for (const p of pools.values()) {
    if (s.seg !== "all" && segOf(p.g) !== s.seg) continue;
    if (s.csex !== "all" && p.g.sex !== s.csex) continue;
    const c = p.st.columns || [], ix = n => c.indexOf(n);
    const iT = ix("Team"), iP = ix("Played"), iW = ix("Won"), iD = ix("Draw"), iL = ix("Lost");
    if (iT < 0 || iP < 0 || iW < 0 || iD < 0 || iL < 0) continue;
    poolCount++;
    for (const r of p.st.rows) {
      const club = clubOf(r[iT]); if (!club) continue;
      const o = clubs.get(club) || { club, teams:0, n:0, w:0, d:0, l:0 };
      o.teams++; o.n += +r[iP] || 0; o.w += +r[iW] || 0; o.d += +r[iD] || 0; o.l += +r[iL] || 0;
      clubs.set(club, o);
    }
  }
  }
  // Minimum played matches to be ranked: 8 overall, 5 once a filter narrows the pools.
  // With every Belgian pool (OlympiaData) a one-team club would top the list on 12 games, so the bar is higher there.
  const CLUB_MIN_PLAYED = (s.seg === "all" && s.csex === "all") ? (A ? (s.season === "indoor" ? 10 : 20) : 8) : (A ? (s.season === "indoor" ? 5 : 10) : 5);
  const rows = [...clubs.values()]
    .filter(o => o.n >= CLUB_MIN_PLAYED || (o.club === "Olympia" && o.n > 0))
    .sort((a, b) => (b.w / b.n) - (a.w / a.n) || b.n - a.n || a.club.localeCompare(b.club));
  const hidden = [...clubs.values()].filter(o => o.n > 0 && o.n < CLUB_MIN_PLAYED && o.club !== "Olympia").length;

  let html = `<div class="stats"><div class="stats-filters">
    <div class="view-toggle">${tog("mode","olympia","Olympia")}${tog("mode","clubs","Clubs")}</div><span class="break"></span>
    ${A ? `<div class="view-toggle">${tog("season","outdoor","Outdoor")}${tog("season","indoor","Indoor")}${tog("season","all","Alle")}</div>` : ""}
    <div class="view-toggle">${tog("seg","all","Alle")}${tog("seg","adult","Volwassenen")}${tog("seg","upper","Bovenbouw")}${tog("seg","mid","Middenbouw")}</div>
    <div class="view-toggle">${tog("csex","all","Alle")}${tog("csex","B","Boys")}${tog("csex","G","Girls")}</div>
  </div>`;
  if (!rows.length) {
    html += `<div class="empty">Nog geen gespeelde wedstrijden voor deze selectie.</div></div>`;
  } else {
    const me = rows.findIndex(o => o.club === "Olympia");
    if (me >= 0) {
      const o = rows[me];
      html += `<div class="stats-head"><div class="big">${me+1}<small>van ${rows.length} clubs</small></div><div class="n">${pctOf(o.w,o.n)}% gewonnen · ${o.n} wedstrijden</div></div>`;
    }
    html += `<ul class="srows">` + rows.map((o, i) => statRow({ rank:i+1, label:o.club, t:o, ours:o.club==="Olympia" })).join("") + `</ul>`;
    html += `
      <div class="stats-note">${A ? `Stand van het seizoen in alle ${poolCount} ${s.season === "all" ? "outdoor- en indoor" : s.season} competitiereeksen van België (U10 tot volwassenen; U7–U9 en bekers hebben geen klassement), bijgewerkt tot ${A.asOf}.${A.joint ? ` ${A.joint} gezamenlijke teams van twee clubs niet meegeteld.` : ""}` : `Stand van het seizoen, enkel in de ${poolCount} reeksen waar Olympia speelt.`}${hidden ? ` ${hidden} club${hidden===1?"":"s"} met minder dan ${CLUB_MIN_PLAYED} wedstrijden niet getoond.` : ""}</div></div>`;
  }
  main.innerHTML = html;
  main.querySelectorAll("[data-sf]").forEach(b => b.addEventListener("click", () => { s[b.dataset.sf] = b.dataset.sv; render(); }));
}

function renderStats() {
  const main = document.getElementById("main");
  const all = (state.results || []).filter(r => computeOutcome(r).cls);
  if (!state.stats) state.stats = { period:"season", week:null, from:"", to:"", cat:"all", sex:"all", age:"all" };
  const s = state.stats;
  if (!s.mode) s.mode = "olympia";
  if (!s.season) s.season = currentSeason();
  if (s.mode === "clubs") { renderClubCompare(main, s); return; }

  // Speeldagen = weeks that have at least one played result, newest first
  const weeks = new Map();
  for (const r of all) {
    const k = fmtDateAPI(mondayOf(new Date(r.date+"T00:00:00")));
    const w = weeks.get(k) || { min:r.date, max:r.date };
    if (r.date < w.min) w.min = r.date; if (r.date > w.max) w.max = r.date;
    weeks.set(k, w);
  }
  const weekKeys = [...weeks.keys()].sort().reverse();
  if (!s.week || !weeks.has(s.week)) s.week = weekKeys[0] || null;
  const dates = all.map(r => r.date).sort();
  if (!s.from) s.from = dates[0] || ""; if (!s.to) s.to = dates[dates.length-1] || "";

  // ---- filter ----
  let list = s.season === "all" ? all : all.filter(r => seasonOf(r) === s.season);
  if (s.period === "week" && s.week) list = list.filter(r => fmtDateAPI(mondayOf(new Date(r.date+"T00:00:00"))) === s.week);
  if (s.period === "range") list = list.filter(r => (!s.from || r.date >= s.from) && (!s.to || r.date <= s.to));
  if (s.cat !== "all") list = list.filter(r => statsGroup(r.olympiaTeam).youth === (s.cat === "youth"));
  if (s.sex !== "all") list = list.filter(r => statsGroup(r.olympiaTeam).sex === s.sex);
  // Age options follow the other filters, so you never pick an empty one.
  const ageSet = [...new Set(list.map(r => statsGroup(r.olympiaTeam).age))]
    .sort((a,b) => TEAM_GROUP_ORDER.indexOf(a) - TEAM_GROUP_ORDER.indexOf(b));
  if (s.age !== "all" && !ageSet.includes(s.age)) s.age = "all";
  if (s.age !== "all") list = list.filter(r => statsGroup(r.olympiaTeam).age === s.age);

  const t = tally(list);
  const tog = (name, val, label) => `<button data-sf="${name}" data-sv="${val}" class="${s[name]===val?'active':''}">${label}</button>`;
  let html = `<div class="stats"><div class="stats-filters">
    <div class="view-toggle">${tog("mode","olympia","Olympia")}${tog("mode","clubs","Clubs")}</div><span class="break"></span>
    <div class="view-toggle">${tog("season","outdoor","Outdoor")}${tog("season","indoor","Indoor")}${tog("season","all","Alle")}</div>
    <div class="view-toggle">${tog("period","season","Seizoen")}${tog("period","week","Speeldag")}${tog("period","range","Periode")}</div>`;
  if (s.period === "week") html += `<select id="st-week" aria-label="Speeldag">${weekKeys.map(k =>
      `<option value="${k}"${k===s.week?" selected":""}>${shortRange(weeks.get(k).min, weeks.get(k).max)}</option>`).join("")}</select>`;
  if (s.period === "range") html += `<input type="date" id="st-from" value="${s.from}" aria-label="Van"><span class="dash">–</span><input type="date" id="st-to" value="${s.to}" aria-label="Tot">`;
  html += `<span class="break"></span>
    <div class="view-toggle">${tog("cat","all","Alle")}${tog("cat","youth","Jeugd")}${tog("cat","adult","Volwassenen")}</div>
    <div class="view-toggle">${tog("sex","all","Alle")}${tog("sex","B","Boys")}${tog("sex","G","Girls")}</div>
    <select id="st-age" aria-label="Leeftijdsgroep"><option value="all">Alle leeftijden</option>${ageSet.map(a =>
      `<option value="${a}"${a===s.age?" selected":""}>${escape((TEAM_GROUP_LABEL[a]||a).replace(" (senior)",""))}</option>`).join("")}</select>
  </div>`;

  if (!t.n) {
    html += `<div class="empty">Geen gespeelde wedstrijden voor deze selectie.</div></div>`;
  } else {
    html += `<div class="stats-head"><div class="big">${pctOf(t.w,t.n)}%<small>gewonnen</small></div><div class="n">${t.n} wedstrijd${t.n===1?"":"en"}</div></div>
      ${wdlBar(t)}
      <div class="wdl-key"><span><b>${t.w}</b> gewonnen</span><span><b>${t.d}</b> gelijk</span><span><b>${t.l}</b> verloren</span></div>`;

    // Breakdown: by group, or by team once a single group is selected
    const groupKeys = new Set(list.map(r => statsGroup(r.olympiaTeam).key));
    const byTeam = groupKeys.size === 1;
    const rows = new Map();
    for (const r of list) {
      const g = statsGroup(r.olympiaTeam);
      const tk = r.olympiaTeam + (seasonOf(r) === "indoor" ? " indoor" : "");
      const k = byTeam ? tk : g.key;
      if (!rows.has(k)) rows.set(k, { key:k, label: byTeam ? tk : g.label, g, games:[] });
      rows.get(k).games.push(r);
    }
    const sorted = [...rows.values()].sort((a,b) => teamComparator({code: byTeam?a.key:a.games[0].olympiaTeam}, {code: byTeam?b.key:b.games[0].olympiaTeam}) || a.label.localeCompare(b.label));
    if (sorted.length > 1 || byTeam) {
      html += `<ul class="srows">` + sorted.map(row => statRow({
        label: row.label, t: tally(row.games),
        attrs: byTeam ? `data-st-team="${escape(row.key)}"` : `data-st-age="${row.g.age}" data-st-sex="${row.g.sex}"`,
      })).join("") + `</ul>`;
    }
    // Results without a filled-in score, under the same filters
    const skipped = (state.results || []).filter(r => {
      if (computeOutcome(r).cls) return false;
      if (s.season !== "all" && seasonOf(r) !== s.season) return false;
      if (s.period === "week" && fmtDateAPI(mondayOf(new Date(r.date+"T00:00:00"))) !== s.week) return false;
      if (s.period === "range" && ((s.from && r.date < s.from) || (s.to && r.date > s.to))) return false;
      const g = statsGroup(r.olympiaTeam);
      if (s.cat !== "all" && g.youth !== (s.cat === "youth")) return false;
      if (s.sex !== "all" && g.sex !== s.sex) return false;
      if (s.age !== "all" && g.age !== s.age) return false;
      return true;
    }).length;
    if (skipped) html += `<div class="stats-note">${skipped} wedstrijd${skipped===1?"":"en"} zonder ingevulde score niet meegeteld.</div>`;
    html += `</div>`;
  }
  main.innerHTML = html;

  main.querySelectorAll("[data-sf]").forEach(b => b.addEventListener("click", () => { s[b.dataset.sf] = b.dataset.sv; render(); }));
  const on = (id, fn) => { const el = main.querySelector(id); if (el) el.addEventListener("change", e => { fn(e.target.value); render(); }); };
  on("#st-week", v => s.week = v); on("#st-from", v => s.from = v); on("#st-to", v => s.to = v); on("#st-age", v => s.age = v);
  main.querySelectorAll("[data-st-age]").forEach(tr => tr.addEventListener("click", () => {
    s.age = tr.dataset.stAge; s.sex = tr.dataset.stSex || "all"; render();
  }));
  main.querySelectorAll("[data-st-team]").forEach(tr => tr.addEventListener("click", () => navigateToTeam(tr.dataset.stTeam)));
}

function shiftWeek(deltaDays) {
  const d = new Date(state.weekStart + "T00:00:00");
  d.setDate(d.getDate() + deltaDays);
  state.weekStart = fmtDateAPI(d);
  render();
}

// ----- Rendering: TEAMS -----
const TEAM_GROUP_ORDER = ["D", "H", "JL", "JM", "G", "T", "U19", "U16", "U14", "U12", "U11", "U10", "U9", "U8", "U7"];
const TEAM_GROUP_LABEL_EN = { D:"Women", H:"Men", JL:"Junior Ladies", JM:"Junior Men", G:"Gentlemen", T:"Trimmers",
  U19:"U19", U16:"U16", U14:"U14", U12:"U12", U11:"U11", U10:"U10", U9:"U9", U8:"U8", U7:"U7" };
const TEAM_GROUP_LABEL = {
  D:"Dames (senior)", H:"Heren (senior)",
  JL:"Junior Ladies", JM:"Junior Men",
  G:"Gentlemen", T:"Trimmers",
  U19:"U19", U16:"U16", U14:"U14", U12:"U12", U11:"U11", U10:"U10", U9:"U9", U8:"U8", U7:"U7",
};
function teamCategory(code) {
  if (!code) return "?";
  const u = code.match(/^(U\d+)/); if (u) return u[1];
  if (code.startsWith("JL") || code.startsWith("JM")) return code.slice(0, 2);
  return code.charAt(0);
}
function teamComparator(a, b) {
  const ca = teamCategory(a.code), cb = teamCategory(b.code);
  const oa = TEAM_GROUP_ORDER.indexOf(ca); const ob = TEAM_GROUP_ORDER.indexOf(cb);
  if (oa !== ob) return (oa < 0 ? 999 : oa) - (ob < 0 ? 999 : ob);
  return a.code.localeCompare(b.code, undefined, { numeric:true });
}
function computeOutcome(r) {
  if (r.olympiaScore == null || r.opponentScore == null) return { cls:"", letter:"" };
  if (r.olympiaScore >  r.opponentScore) return { cls:"win",  letter:"W" };
  if (r.olympiaScore <  r.opponentScore) return { cls:"loss", letter:"L" };
  return { cls:"draw", letter:"D" };
}

function renderTeams() {
  const main = document.getElementById("main");
  const teams = (state.teams || []).filter(t => inSeason(t));
  if (teams.length === 0) {
    main.innerHTML = `<div class="empty">No team data — run <code>update.ps1</code> again.</div>`;
    return;
  }
  // Default to favorite team if set; otherwise first team in the list.
  if (!state.selectedTeam || !teams.find(t => t.key === state.selectedTeam)) {
    state.selectedTeam = state.favoriteTeam && teams.find(t => t.key === state.favoriteTeam)
      ? state.favoriteTeam
      : teams[0].key;
  }
  const team = teams.find(t => t.key === state.selectedTeam);
  const tSeason = seasonOf(team);
  const isFav = state.favoriteTeam === team.key;

  // Dropdown grouped by category
  const sorted = [...teams].sort(teamComparator);
  // Grouped by category; indoor teams in their own groups after the outdoor ones.
  const grouped = new Map();
  for (const t of sorted) {
    const c = seasonOf(t) + "|" + teamCategory(t.code);
    if (!grouped.has(c)) grouped.set(c, []);
    grouped.get(c).push(t);
  }
  const optgroups = [];
  for (const sea of ["outdoor", "indoor"]) for (const cat of TEAM_GROUP_ORDER) {
    const list = grouped.get(sea + "|" + cat);
    if (!list) continue;
    const opts = list.map(t =>
      `<option value="${escape(t.key)}" ${t.key === team.key ? "selected" : ""}>${escape(t.code)}${sea === "indoor" ? " · Indoor" : ""}</option>`
    ).join("");
    const lbl = (TEAM_GROUP_LABEL_EN[cat] || cat) + (sea === "indoor" ? " · Indoor" : state.season === "all" && teams.some(x => seasonOf(x) === "indoor") ? " · Outdoor" : "");
    optgroups.push(`<optgroup label="${escape(lbl)}">${opts}</optgroup>`);
  }

  let html = `<div class="team-controls">
    <label for="team-select">Team</label>
    <select id="team-select">${optgroups.join("")}</select>
    <div class="team-comp">${escape(cleanDivision(team.division))}<span class="season-tag ${tSeason}">${tSeason === "indoor" ? "Indoor" : "Outdoor"}</span></div>
    <button id="fav-toggle" class="fav-toggle ${isFav?'active':''}" type="button" title="${isFav?'Remove from favourites':'Make favourite team'}">
      <span class="fav-icon">${isFav ? '★' : '☆'}</span><span class="fav-label"> Favourite</span>
    </button>
  </div>`;

  // Hero: Next match card — biggest piece of info on the team page
  const nextMatch = (state.teamGames || []).find(g => g.olympiaTeam === team.code && seasonOf(g) === tSeason);
  if (nextMatch) {
    const homeHtml = nextMatch.isHome ? `<strong>Olympia ${escape(nextMatch.olympiaTeam)}</strong>` : `${escape(nextMatch.opponentClub)} ${escape(nextMatch.opponentTeam)}`;
    const awayHtml = nextMatch.isHome ? `${escape(nextMatch.opponentClub)} ${escape(nextMatch.opponentTeam)}` : `<strong>Olympia ${escape(nextMatch.olympiaTeam)}</strong>`;
    let locHtml = "";
    if (nextMatch.isHome && nextMatch.fieldCode) {
      locHtml = `<span class="field-badge" data-nav-date="${escape(nextMatch.date)}" data-nav-time="${escape(nextMatch.time)}">${escape(fieldLabel(nextMatch.fieldCode, nextMatch.subpath))} <span class="field-arrow">→</span></span>`;
    } else if (!nextMatch.isHome) {
      const where = seasonOf(nextMatch) === "indoor" && nextMatch.venue ? `AWAY · ${escape(nextMatch.venue)}` : `AWAY at ${escape(nextMatch.opponentClub)}`;
      locHtml = `<a class="map-link" href="${mapUrl(nextMatch)}" target="_blank" rel="noopener">${where} <span class="map-icon">↗</span></a>`;
    } else if (nextMatch.venue) {
      locHtml = `<a class="map-link" href="${mapUrl(nextMatch)}" target="_blank" rel="noopener">HOME · ${escape(nextMatch.venue)} <span class="map-icon">↗</span></a>`;
    } else {
      locHtml = `<span class="loc-tag home">home</span>`;
    }
    html += `<div class="next-match-hero">
      <div class="hero-tag">Next match</div>
      <div class="hero-teams">${homeHtml} <span class="hero-vs">vs</span> ${awayHtml}</div>
      <div class="hero-meta">
        <span>${formatDateLong(nextMatch.date)}</span>
        <span class="sep">·</span>
        <span>${escape(nextMatch.time)}</span>
        <span class="sep">·</span>
        ${locHtml}
      </div>
    </div>`;
  }

  // Standings + this-week-in-pool side-by-side (stacks on narrow viewports)
  // U7-U9: no scores are kept, so there is never a standing or a results round to show.
  const noScores = /^U[789][BG]/i.test(team.code);
  html += `<section class="team-section pool-row"${noScores ? ' style="display:none"' : ''}>`;
  html += `<div class="pool-col standing-col"><h2>Standings</h2>`;
  if (team.standing && team.standing.rows && team.standing.rows.length > 0) {
    // Source columns from API: Rank, Team, Played, Won, Lost, Draw, Own Goals, Against Goals, Points
    // Display order: Rank, Team, P, W, D, L, Pt, Ds, +, - (with Ds = own - against computed here).
    const headers = ["#", "Team", "P", "W", "D", "L", "Pts", "GD", "GF", "GA"];
    const myLabel = `Olympia ${team.code}`;
    html += `<div class="standing-wrap"><table class="standing-table">
      <thead><tr>${headers.map((h, i) => `<th class="col-${i}">${escape(h)}</th>`).join("")}</tr></thead>
      <tbody>${team.standing.rows.map(row => {
        const own = parseInt(row[6], 10) || 0;
        const against = parseInt(row[7], 10) || 0;
        const ds = own - against;
        const cells = [
          row[0],                                  // Rank
          row[1],                                  // Team (may be Olympia X — clickable)
          row[2],                                  // P
          row[3],                                  // W
          row[5],                                  // D
          row[4],                                  // L
          row[8],                                  // Pt
          (ds > 0 ? "+" : "") + ds,                // Ds
          row[6],                                  // +
          row[7],                                  // -
        ];
        const isOurs = (row[1] || "").trim() === myLabel;
        return `<tr class="${isOurs ? "ours" : ""}">${cells.map((cell, i) => {
          const cls = i === 0 ? "rank" : (i === 1 ? "team" : "num");
          const content = (i === 1) ? teamCell(cell, tSeason) : escape(String(cell));
          return `<td class="${cls} col-${i}">${content}</td>`;
        }).join("")}</tr>`;
      }).join("")}</tbody>
    </table></div>`;
  } else {
    html += `<div class="empty-section">No standings available for this competition.</div>`;
  }
  html += `</div>`;  // .standing-col

  // Pool-wide games this calendar week (Mon-Sun) — all teams in the competition,
  // not just Olympia. Shows results for past days and scheduled matches for upcoming.
  html += `<div class="pool-col pool-week-col"><h2>Last match day results</h2>`;
  const poolList = (state.poolGames && team.poolId) ? (state.poolGames[team.poolId] || []) : [];
  if (poolList.length === 0) {
    html += `<div class="empty-section">No pool matches found.</div>`;
  } else {
    // Strict "prior calendar week" — Mon-Sun of the week BEFORE the one we're currently in.
    // If today is in the same week as a matchday, those games still count (they were
    // played "this week" if it's after today, etc.). We only want the fully-completed
    // previous week.
    const thisMon = mondayOf(new Date());
    const priorMon = new Date(thisMon); priorMon.setDate(thisMon.getDate() - 7);
    const priorSun = new Date(thisMon); priorSun.setDate(thisMon.getDate() - 1);
    const priorMonIso = fmtDateAPI(priorMon);
    const priorSunIso = fmtDateAPI(priorSun);
    const recent = poolList
      .filter(p => p.isPast && p.date >= priorMonIso && p.date <= priorSunIso)
      .sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
    if (recent.length === 0) {
      html += `<div class="empty-section">No results last week (${priorMon.getDate()}/${priorMon.getMonth()+1} – ${priorSun.getDate()}/${priorSun.getMonth()+1}).</div>`;
    } else {
      html += `<ul class="umr-list">`;
      for (const p of recent) {
        const isOlympiaHome = p.homeClub === "Olympia";
        const isOlympiaAway = p.awayClub === "Olympia";
        const isOurMatch = (isOlympiaHome && p.homeTeam === team.code) || (isOlympiaAway && p.awayTeam === team.code);
        const home = isOlympiaHome ? olympiaLink(p.homeTeam, tSeason) : `${escape(p.homeClub)} ${escape(p.homeTeam)}`;
        const away = isOlympiaAway ? olympiaLink(p.awayTeam, tSeason) : `${escape(p.awayClub)} ${escape(p.awayTeam)}`;
        const score = (p.homeScore != null && p.awayScore != null)
          ? `${p.homeScore} – ${p.awayScore}` : "n/p";
        // Color OUR row's score pill by outcome — others stay neutral
        let midCls = "";
        if (isOurMatch && p.homeScore != null && p.awayScore != null) {
          const olympiaScore = isOlympiaHome ? p.homeScore : p.awayScore;
          const opponentScore = isOlympiaHome ? p.awayScore : p.homeScore;
          midCls = olympiaScore > opponentScore ? "win"
                 : olympiaScore < opponentScore ? "loss" : "draw";
        }
        html += unifiedMatchRow({
          date: formatDDMM(p.date),
          homeHtml: home, awayHtml: away,
          mid: score, midCls,
          trailHtml: "",
          className: isOurMatch ? "our-match" : "",
        });
      }
      html += `</ul>`;
    }
  }
  html += `</div>`;  // .pool-week-col
  html += `</section>`;  // .pool-row

  // Upcoming matches first (teamGames — sorted ascending by update.ps1)
  const upcoming = (state.teamGames || []).filter(g => g.olympiaTeam === team.code && seasonOf(g) === tSeason);
  html += `<section class="team-section">
    <h2>Upcoming matches</h2>`;
  if (upcoming.length === 0) {
    html += `<div class="empty-section">No scheduled matches.</div>`;
  } else {
    html += `<ul class="umr-list">`;
    for (const g of upcoming.slice(0, 12)) {
      const homeHtml = g.isHome ? `<strong>${olympiaLink(g.olympiaTeam, tSeason)}</strong>` : `${escape(g.opponentClub)} ${escape(g.opponentTeam)}`;
      const awayHtml = g.isHome ? `${escape(g.opponentClub)} ${escape(g.opponentTeam)}` : `<strong>${olympiaLink(g.olympiaTeam, tSeason)}</strong>`;
      let trailHtml;
      if (g.isHome && g.fieldCode) {
        trailHtml = `<span class="field-badge" data-nav-date="${escape(g.date)}" data-nav-time="${escape(g.time)}" title="Open in Pitches">${escape(fieldLabel(g.fieldCode, g.subpath))} <span class="field-arrow">→</span></span>`;
      } else if (g.isHome && g.venue) {
        trailHtml = `<a class="loc-tag home map-loc" href="${mapUrl(g)}" target="_blank" rel="noopener" title="${escape(g.venue)} · open in Google Maps">home ↗</a>`;
      } else if (g.isHome) {
        trailHtml = `<span class="loc-tag home">home</span>`;
      } else {
        trailHtml = `<a class="loc-tag away map-loc" href="${mapUrl(g)}" target="_blank" rel="noopener" title="${escape(g.venue || g.opponentClub)} · open in Google Maps">away ↗</a>`;
      }
      html += unifiedMatchRow({
        date: formatDDMM(g.date),
        homeHtml, awayHtml,
        mid: g.time, midCls: "time",
        trailHtml,
        className: "upcoming",
      });
    }
    html += `</ul>`;
  }
  html += `</section>`;

  // Last matches (results — already sorted by update.ps1 most-recent-first)
  const lastMatches = (state.results || []).filter(r => r.olympiaTeam === team.code && seasonOf(r) === tSeason).slice(0, 10);
  html += `<section class="team-section">
    <h2>Recent matches</h2>`;
  if (lastMatches.length === 0) {
    html += `<div class="empty-section">No recent matches found.</div>`;
  } else {
    html += `<ul class="umr-list">`;
    for (const r of lastMatches) {
      const o = computeOutcome(r);
      const homeHtml = r.isHome ? `<strong>${olympiaLink(r.olympiaTeam, tSeason)}</strong>` : `${escape(r.opponentClub)} ${escape(r.opponentTeam)}`;
      const awayHtml = r.isHome ? `${escape(r.opponentClub)} ${escape(r.opponentTeam)}` : `<strong>${olympiaLink(r.olympiaTeam, tSeason)}</strong>`;
      const score = (r.olympiaScore != null && r.opponentScore != null)
        ? (r.isHome ? `${r.olympiaScore} – ${r.opponentScore}` : `${r.opponentScore} – ${r.olympiaScore}`)
        : "n/p";
      html += unifiedMatchRow({
        date: formatDDMM(r.date),
        homeHtml, awayHtml,
        mid: score, midCls: o.cls,
        trailHtml: "",   // colored score pill already conveys W/V/G
        className: `result ${o.cls}`,
      });
    }
    html += `</ul>`;
  }
  main.innerHTML = html;
  const favBtn = document.getElementById("fav-toggle");
  if (favBtn) favBtn.addEventListener("click", () => {
    setFavoriteTeam(state.favoriteTeam === team.key ? null : team.key);
    render();
  });
  document.getElementById("team-select").addEventListener("change", e => {
    state.selectedTeam = e.target.value;
    render();
  });
}

// ----- State -----
const FAV_TEAM_KEY = "olympia_fav_team";
const state = {
  date: fmtDateAPI(new Date()),
  view: "layout",        // landing page = Pitches
  season: (() => { try { return localStorage.getItem("olympia_season") || "all"; } catch (e) { return "all"; } })(),
  fieldGames: [],
  teamGames: [],
  results: [],
  teams: [],
  poolGames: {},
  activeSlot: null,
  selectedTeam: null,
  weekStart: null,
  // Veldbezetting state: mode = "all" (3-col) | "one" (1-col), selectedField = "1"|"2"|"5"
  veldbezettingMode: null,
  selectedField: null,
  favoriteTeam: (typeof localStorage !== "undefined" ? localStorage.getItem(FAV_TEAM_KEY) : null) || null,
  updated: null,
};

function setFavoriteTeam(code) {
  state.favoriteTeam = code || null;
  try {
    if (code) localStorage.setItem(FAV_TEAM_KEY, code);
    else      localStorage.removeItem(FAV_TEAM_KEY);
  } catch {}
}

// Standings: the all-Belgium standings page (klassementen.html) in a frame that grows with it.
function renderStandings() {
  const main = document.getElementById("main");
  main.innerHTML = '<iframe id="standings-frame" class="embed-frame" title="Standings" src="klassementen.html?embed=1&kind=' + (state.season === "all" ? currentSeason() : state.season) + '"></iframe>';
  const fr = document.getElementById("standings-frame");
  fr.addEventListener("load", () => {
    let doc = null; try { doc = fr.contentDocument; } catch (e) {}
    if (!doc) { fr.style.height = "80vh"; return; }   // file:// preview: no access, fixed height
    const fit = () => { fr.style.height = doc.documentElement.scrollHeight + "px"; };
    new ResizeObserver(fit).observe(doc.body); fit();
  });
}
function setSeason(v) {
  state.season = v;
  try { localStorage.setItem(SEASON_KEY, v); } catch (e) {}
}
function syncHeader() {
  const segs = document.getElementById("season-segs");
  if (segs) {
    segs.style.display = SITE === "calendar" && state.view !== "layout" ? "" : "none";
    segs.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.season === state.season));
  }
  const bar = document.getElementById("datebar");
  if (bar) bar.style.display = SITE === "calendar" && state.view === "layout" ? "" : "none";
  const btn = document.getElementById("date-btn");
  if (btn && state.date) {
    const d = new Date(state.date + "T00:00:00");
    btn.textContent = d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) +
      (d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : "");
  }
}
function render() {
  syncHeader();
  renderFavoriteChip();
  if (state.view === "standings") { renderStandings(); return; }
  if (state.view === "teams") { renderTeams(); return; }
  if (state.view === "week")  { renderWeek();  return; }
  if (state.view === "stats") { renderStats(); return; }
  // "layout" tab now means Veldbezetting (mini-map + slider + timeline)
  renderVeldbezetting();
}

// Favorite-team chip: a small banner under the header. Click it to jump
// straight to that team's page; tap ✕ to clear. Hidden when no favorite is set.
function renderFavoriteChip() {
  let bar = document.getElementById("fav-bar");
  if (!bar) {
    bar = document.createElement("div");
    bar.id = "fav-bar";
    document.querySelector("header").after(bar);
  }
  if (!state.favoriteTeam || SITE === "data") { bar.innerHTML = ""; bar.style.display = "none"; return; }
  bar.style.display = "";
  bar.innerHTML = `<button class="fav-chip" type="button" title="Open favourite team">
      <span class="fav-star">★</span>
      <span class="fav-text">Favourite: ${escape(keyCode(state.favoriteTeam))}${keySeason(state.favoriteTeam) === "indoor" ? " · Indoor" : ""}</span>
    </button>
    <button class="fav-clear" type="button" title="Remove favourite">✕</button>`;
  bar.querySelector(".fav-chip").addEventListener("click", () => navigateToTeam(state.favoriteTeam));
  bar.querySelector(".fav-clear").addEventListener("click", () => { setFavoriteTeam(null); renderFavoriteChip(); });
}

// Navigate to a team page from anywhere a team name was clicked.
function navigateToTeam(code) {
  if (SITE === "data") return;   // OlympiaData has no Teams view
  if (state.season !== "all" && keySeason(code) !== state.season) setSeason("all");
  state.selectedTeam = code;
  state.view = "teams";
  document.querySelectorAll("header .tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.view === "teams"));
  render();
}
// Navigate to the field-layout view for a specific date + time slot. Used when a
// user clicks a "Veld X" badge on a home game in the Teams view.
function navigateToFieldView(date, time) {
  state.date = date;
  state.view = "layout";
  state.activeSlot = time;
  const di = document.getElementById("date");
  if (di) di.value = date;
  document.querySelectorAll("header .tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.view === "layout"));
  render();
}
function fieldLabel(fieldCode, subpath) {
  if (!fieldCode) return "";
  const sub = (Array.isArray(subpath) ? subpath : []).join("");
  // Format: "Veld 5A" (half), "Veld 5B1a" (eighth), "Veld 2 (volledig)" (full field).
  return sub ? `Pitch ${fieldCode}${sub}` : `Pitch ${fieldCode} (full)`;
}

// ----- Site split -----
// OlympiaCalendar shows Veldbezetting, Resultaten, Teams; OlympiaData shows Statistiek only.
const SITE = document.documentElement.dataset.site === "data" ? "data" : "calendar";
// ?embed=1: shown inside the Clubs en teams page (Olympia > Statistiek), so no header of its own.
const EMBED = SITE === "data" && new URLSearchParams(location.search).get("embed") === "1";
let siteApplied = false;
function applySite() {
  if (siteApplied) return;
  siteApplied = true;
  const keep = SITE === "data" ? ["stats"] : ["layout", "week", "teams", "standings"];
  document.querySelectorAll("header .tabs button").forEach(b => { if (!keep.includes(b.dataset.view)) b.remove(); });
  if (SITE !== "data") return;
  state.view = "stats";
  document.querySelector('header .tabs button[data-view="stats"]').classList.add("active");
  document.title = "HC Olympia — Statistiek";
  document.querySelector("header h1 .sub").textContent = "Statistiek";
  document.getElementById("datebar").style.display = "none";
  const nav = document.createElement("a");
  nav.className = "navlink"; nav.href = "index.html"; nav.title = "Clubs en teams (wachtwoord)"; nav.textContent = "Clubs en teams ▶";
  document.querySelector("header .hnav").appendChild(nav);
  if (EMBED) {
    document.querySelector("header").style.display = "none";
    document.getElementById("main").style.padding = "0 0 24px";
  }
}

// ----- Boot -----
function init() {
  applySite();
  const data = loadEmbedded();
  state.fieldGames = data.fieldGames;
  state.teamGames  = data.teamGames;
  state.results    = data.results;
  state.teams      = data.teams;
  state.poolGames  = data.poolGames;
  state.allClubs   = data.allClubs;
  for (const t of state.teams || []) t.key = teamKeyOf(t.code, seasonOf(t));
  state.updated    = data.updated;
  document.getElementById("status").textContent = `${SITE === "data" ? "Bijgewerkt" : "Updated"} ${fmtUpdated(data.updated)}`;

  document.getElementById("date").value = state.date;
  document.getElementById("date").addEventListener("change", e => {
    state.date = e.target.value; state.activeSlot = null; render();
  });
  document.getElementById("season-segs").addEventListener("click", e => {
    const b = e.target.closest("button[data-season]"); if (!b) return;
    setSeason(b.dataset.season); render();
  });
  document.getElementById("date-btn").addEventListener("click", () => {
    const inp = document.getElementById("date");
    try { if (inp.showPicker) { inp.showPicker(); return; } } catch (e) {}
    inp.focus(); inp.click();
  });
  document.getElementById("prev").addEventListener("click", () => shiftDay(-1));
  document.getElementById("next").addEventListener("click", () => shiftDay(+1));
  function shiftDay(delta) {
    const d = new Date(state.date + "T00:00:00");
    d.setDate(d.getDate() + delta);
    state.date = fmtDateAPI(d);
    document.getElementById("date").value = state.date;
    state.activeSlot = null; render();
  }
  document.querySelectorAll("header .tabs button").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll("header .tabs button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      state.view = b.dataset.view; render();
    });
  });
  // Re-render on viewport breakpoint changes (mobile/desktop swap, rotation).
  let lastIsMobile = window.matchMedia("(max-width: 720px)").matches;
  let resizeT;
  window.addEventListener("resize", () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      const m = window.matchMedia("(max-width: 720px)").matches;
      if (m !== lastIsMobile) { lastIsMobile = m; render(); }
    }, 150);
  });

  // Delegated handler: .team-link opens the team page; .field-badge opens Veldindeling.
  document.getElementById("main").addEventListener("click", e => {
    const fb = e.target.closest(".field-badge");
    if (fb) {
      e.preventDefault();
      navigateToFieldView(fb.dataset.navDate, fb.dataset.navTime);
      return;
    }
    const link = e.target.closest(".team-link");
    if (link) {
      e.preventDefault();
      navigateToTeam(link.dataset.team);
    }
  });
  render();
}

// OlympiaData: the Statistiek data is encrypted (see HockeyCensus/stats_key.js). The census
// password unwraps the data key from #stats-key; the data key decrypts #stats-box into
// #games-data, then the page boots as usual. The password is kept in sessionStorage for this
// tab only, so moving between Clubs en teams and Statistiek asks once.
const PW_KEY = "olympia_pw";
async function openStats(pw) {
  const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  const wrapped = JSON.parse(document.getElementById("stats-key").textContent);
  const box = JSON.parse(document.getElementById("stats-box").textContent);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const kek = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:unb64(wrapped.salt), iterations:wrapped.iter, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const dek = await crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(wrapped.iv) }, kek, unb64(wrapped.ct));
  const key = await crypto.subtle.importKey("raw", dek, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(box.iv) }, key, unb64(box.ct));
  return new TextDecoder().decode(plain);
}
async function unlockStats(pw, quiet) {
  const err = document.getElementById("stats-err");
  if (!quiet) err.textContent = "Bezig…";
  let json;
  try { json = await openStats(pw); }
  catch (e) {
    try { sessionStorage.removeItem(PW_KEY); } catch {}
    if (!quiet) err.textContent = "Fout wachtwoord.";
    return;
  }
  try { sessionStorage.setItem(PW_KEY, pw); } catch {}
  document.getElementById("games-data").textContent = json;
  init();   // outside the try: a page bug must not look like a wrong password
}
function showStatsLock() {
  applySite();
  document.getElementById("main").innerHTML =
    `<div style="max-width:360px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px">
      <h2 style="margin:0 0 12px;font-size:16px">Beveiligde pagina</h2>
      <form id="stats-unlock" style="display:flex;gap:8px"><input id="stats-pw" type="password" placeholder="Wachtwoord" autocomplete="current-password" style="flex:1;min-width:0;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:inherit" autofocus /><button style="background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:inherit;cursor:pointer">Open</button></form>
      <div id="stats-err" style="color:#ff7a90;font-size:13px;margin-top:10px;min-height:18px"></div></div>`;
  document.getElementById("stats-unlock").addEventListener("submit", e => {
    e.preventDefault(); unlockStats(document.getElementById("stats-pw").value);
  });
  let saved = null;
  try { saved = sessionStorage.getItem(PW_KEY); } catch {}
  if (saved) unlockStats(saved, true);
}
if (SITE === "data") showStatsLock(); else init();
</script>
