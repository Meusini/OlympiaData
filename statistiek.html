<!doctype html>
<html lang="nl" data-site="data">
<!-- data-site: "calendar" = OlympiaCalendar (Veldbezetting, Resultaten, Teams).
     build_data_site.js copies this file to OlympiaData/statistiek.html with data-site="data",
     which keeps only the Statistiek view. One source, two sites: edit here, never in the copy. -->
<head>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>HC Olympia — Statistiek</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --line:#2a2f3a;
    --text:#e6e8ec; --muted:#8b93a3; --accent:#3aa3ff; --accent2:#7adfb0;
    --warn:#ffb86b; --bad:#ff7a90;
    --u7:#9b8cff; --u8:#7ad6ff; --u9:#7adfb0; --u10:#a7e26a;
    --u11:#d8db5a; --u12:#ffc36e; --u14:#ff9d6e; --u16:#ff7a90;
    --u19:#ff7adf; --senior:#3aa3ff; --gent:#a988ff; --junior:#56e3d3;
    --trim:#888; --gk:#5fd3c8; --other:#6b7280;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--text);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; }
  a { color:var(--accent); }

  header {
    display:flex; align-items:center; gap:16px; padding:14px 20px;
    background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10;
  }
  header .logo {
    height:42px; width:auto; object-fit:contain;
    background:#fff; border-radius:8px; padding:4px;
    box-shadow:0 1px 4px rgba(0,0,0,.3);
  }
  header h1 { margin:0; font-size:18px; font-weight:600; letter-spacing:.2px; }
  header h1 .sub { color:var(--muted); font-weight:400; margin-left:8px; font-size:13px; }
  header .grow { flex:1; }
  header input[type=date], header select, header button {
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:7px 11px; font:inherit;
  }
  header button { cursor:pointer; }
  header button:hover { border-color:var(--accent); }
  header .tabs { display:flex; gap:4px; background:var(--panel2); border-radius:10px; padding:3px; border:1px solid var(--line); }
  header .tabs button { background:transparent; border:none; padding:6px 12px; border-radius:7px; color:var(--muted); }
  header .tabs button.active { background:var(--accent); color:#0b1320; font-weight:600; }
  header .status { font-size:12px; color:var(--muted); }
  header .navlink { text-decoration:none; padding:7px 11px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); white-space:nowrap; }
  header .navlink:hover { border-color:var(--accent); }

  main { padding:18px 20px 60px; }
  .empty { padding:60px; text-align:center; color:var(--muted); }
  .error { padding:18px; border:1px solid var(--bad); background:rgba(255,122,144,.08); color:var(--bad); border-radius:10px; }

  /* ======== TIMELINE VIEW ======== */
  .timeline-wrap { display:grid; grid-template-columns: 60px repeat(3, 1fr); gap:8px; }
  .col-header {
    grid-row: 1; padding:12px 10px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px 10px 0 0; font-weight:600; text-align:center; font-size:16px;
  }
  .col-header .count { color:var(--muted); font-weight:400; font-size:13px; margin-left:6px; }
  .time-axis { position:relative; }
  .time-axis .hour {
    position:absolute; right:6px; color:var(--muted); font-variant-numeric:tabular-nums; font-size:13px;
    transform:translateY(-50%);
  }
  .field-col { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:0 0 10px 10px; }
  /* Field switcher row (phone only — desktop uses 3-column timeline) */
  .mobile-field-switcher { display:none; }
  .field-col .hour-line {
    position:absolute; left:0; right:0; border-top:1px dashed var(--line); opacity:.5;
  }
  .game {
    position:absolute; padding:8px 10px; border-radius:8px;
    background:var(--panel2); border:1px solid var(--line);
    overflow:hidden; cursor:default;
    box-shadow: 0 1px 0 rgba(255,255,255,.03);
  }
  .game .time { font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; font-weight:500; }
  .game .teams { font-weight:600; font-size:15px; margin-top:2px; line-height:1.25; }
  .game .div { font-size:12px; color:var(--muted); margin-top:3px; }
  .game .sub { display:inline-block; padding:1px 6px; border-radius:4px; background:rgba(255,255,255,.06);
    color:var(--text); font-size:11px; margin-left:6px; font-variant-numeric:tabular-nums; font-weight:600; }
  /* Stacked half-cells or deep-subdivided cells get tighter typography so team names fit. */
  .game.cramped { padding:4px 6px; }
  .game.cramped .time  { font-size:11px; }
  .game.cramped .teams { font-size:12px; line-height:1.18; margin-top:1px; }
  .game.cramped .sub   { font-size:10px; padding:0 4px; margin-left:4px; }
  .game.age-u7  { border-left:4px solid var(--u7); }
  .game.age-u8  { border-left:4px solid var(--u8); }
  .game.age-u9  { border-left:4px solid var(--u9); }
  .game.age-u10 { border-left:4px solid var(--u10); }
  .game.age-u11 { border-left:4px solid var(--u11); }
  .game.age-u12 { border-left:4px solid var(--u12); }
  .game.age-u14 { border-left:4px solid var(--u14); }
  .game.age-u16 { border-left:4px solid var(--u16); }
  .game.age-u19 { border-left:4px solid var(--u19); }
  .game.age-senior { border-left:4px solid var(--senior); }
  .game.age-gent   { border-left:4px solid var(--gent); }
  .game.age-junior { border-left:4px solid var(--junior); }
  .game.age-trim   { border-left:4px solid var(--trim); }
  .game.age-gk     { border-left:4px solid var(--gk); }
  .game.age-other  { border-left:4px solid var(--other); }
  /* Training blocks: dashed outline + hatched fill so they read as "reserved", not "match". */
  .game.training {
    border-style:dashed; border-color:rgba(255,255,255,.22);
    background:repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 6px, transparent 6px 12px), var(--panel);
    z-index:0;
  }
  .game.match { z-index:1; }
  .game .kind {
    display:inline-block; padding:1px 5px; border-radius:4px; margin-left:6px;
    font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
    background:rgba(255,255,255,.08); color:var(--muted);
  }
  .game.cramped .kind { font-size:9px; padding:0 4px; margin-left:4px; }
  .game.training .teams { font-weight:500; }
  .game.conflict { border-color:rgba(255,122,144,.6); }
  .game.conflict .kind { background:rgba(255,122,144,.2); color:#ffb3c0; }

  /* ======== FIELD LAYOUT VIEW ======== */
  .layout-controls { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .layout-controls .slot-select {
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:8px 14px; font:inherit; font-size:15px; cursor:pointer;
    font-variant-numeric:tabular-nums; font-weight:600;
    min-width:120px;
  }
  .layout-controls .slot-select:hover { border-color:var(--accent); }
  .layout-controls .now-label { color:var(--muted); font-size:14px; margin-right:6px; }

  /* Club mini-map at top of Veldindeling — spatial reference */
  .club-map {
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; max-width:1100px; margin-bottom:14px;
  }
  .club-map svg { width:100%; height:auto; max-height:160px; display:block; }
  .club-map .map-pitch {
    fill: #1d4528; stroke:#2d6a3e; stroke-width:1.5;
    cursor:pointer; transition: fill 120ms, stroke 120ms;
  }
  .club-map .map-pitch:hover { fill:#26593a; stroke:#3e8a52; }
  .club-map .map-pitch.active { fill:#2a5a3a; stroke:var(--accent2); stroke-width:2; }
  .club-map .map-clubhouse { fill:#7a3f25; stroke:#a55630; stroke-width:1.5; }
  .club-map .map-label {
    fill:#e6e8ec; font-size:15px; font-weight:600; pointer-events:none;
    dominant-baseline:middle;
  }
  .club-map .map-label .map-count { fill:var(--accent2); font-weight:700; }
  .club-map .clubhouse-label { fill:#ffe2cc; font-size:13px; }

  /* Week (Resultaten) view: per-team section instead of per-day */
  .week-team { max-width:1100px; margin-bottom:20px; }
  .week-team h3 {
    margin:0 0 8px; font-size:15px; color:var(--text);
    text-transform:uppercase; letter-spacing:.5px; opacity:.85;
    display:flex; align-items:baseline; gap:10px;
  }
  .week-team h3 .team-meta { font-size:12px; color:var(--muted); font-weight:400; letter-spacing:0; text-transform:none; }

  /* Resultaten — date-grouped compact rows: home — [score / div] — away.
     Same shape on both viewports; mobile hides the division line. */
  .week-day-compact { margin:0 auto 18px; max-width:900px; }
  .week-day-compact h3 {
    margin:0 0 8px; font-size:14px; color:var(--text);
    text-transform:uppercase; letter-spacing:.5px; opacity:.85;
    display:flex; align-items:center; gap:8px;
  }
  .week-day-compact.today h3 { color:var(--accent); opacity:1; }
  .week-day-compact .today-tag {
    font-size:10px; padding:1px 7px; border-radius:4px;
    background:var(--accent); color:#0b1320; font-weight:700; letter-spacing:.5px;
  }
  ul.rd-list { list-style:none; padding:0; margin:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .rd-row {
    display:grid; grid-template-columns: 1fr auto 1fr;
    gap:14px; align-items:center;
    padding:10px 14px; border-bottom:1px solid var(--line);
    font-size:14px; line-height:1.25;
  }
  .rd-row:last-child { border-bottom:none; }
  .rd-row .rd-home { text-align:right; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rd-row .rd-away { text-align:left;  min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rd-row .rd-mid  { display:flex; flex-direction:column; align-items:center; gap:2px; min-width:70px; }
  .rd-row .rd-score {
    font-weight:700; font-variant-numeric:tabular-nums;
    padding:2px 9px; border-radius:5px; text-align:center;
    background:var(--panel2); border:1px solid var(--line);
    font-size:13px; min-width:64px;
  }
  .rd-row .rd-div {
    font-size:11px; color:var(--muted); white-space:nowrap;
    max-width:240px; overflow:hidden; text-overflow:ellipsis;
  }
  .rd-row .rd-score.win  { background:rgba(122,223,176,.20); border-color:rgba(122,223,176,.45); color:#aef0c8; }
  .rd-row .rd-score.loss { background:rgba(255,122,144,.16); border-color:rgba(255,122,144,.40); color:#ffb3c0; }
  .rd-row .rd-score.draw { background:rgba(255,184,107,.16); border-color:rgba(255,184,107,.40); color:#ffd29a; }
  .rd-row .rd-score.upcoming { background:transparent; color:var(--muted); border-style:dashed; }

  /* Layout view: spatial map of the club. Clubhuis is a vertical bar on the right
     (next to Veld 1) — mirrors where it physically sits at Wilrijkse Plein. */
  .fields-row {
    display:grid; grid-template-columns: 1fr 1fr 150px;
    grid-template-rows: auto auto;
    gap:20px; align-items:stretch; max-width:1400px; margin:0 auto;
  }
  .field-card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .field-card h3 { margin:0 0 12px; font-size:18px; display:flex; justify-content:space-between; align-items:center; }
  .field-card h3 .meta { color:var(--muted); font-weight:400; font-size:13px; }
  .pitch {
    position:relative; width:100%; aspect-ratio: 55/91;
    background: repeating-linear-gradient(90deg, #1b3f25, #1b3f25 8px, #1d4528 8px, #1d4528 16px);
    border:2px solid #2d6a3e; border-radius:6px; overflow:hidden;
  }
  /* Pitch markings (centre line, 23m lines, D circles, goals) — drawn under subcells. */
  .pitch-lines {
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:0;
  }
  /* Clubhuis bar — narrow strip, full-height, vertical text */
  .field-card.clubhuis {
    background:rgba(217,124,68,.10); border-color:rgba(217,124,68,.50);
    padding:6px; display:flex; align-items:stretch; justify-content:center;
    min-height:180px;
  }
  .clubhuis-box {
    width:100%; flex:1; aspect-ratio: auto;
    background: linear-gradient(160deg, #d97c44 0%, #b85e2e 100%);
    border:2px solid #8a4520; border-radius:6px;
    display:flex; flex-direction:column; align-items:center; justify-content:space-evenly;
    padding:14px 2px; color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .clubhuis-icon { font-size:42px; line-height:1; opacity:.95; }
  .clubhuis-text {
    writing-mode:vertical-rl; text-orientation:mixed;
    font-weight:700; font-size:18px; letter-spacing:6px;
    transform:rotate(180deg);   /* reads top→bottom, normal letter orientation */
  }
  .subcell {
    position:absolute; border:1px solid rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center; text-align:center;
    color:#fff; padding:6px;
  }
  .subcell.empty {
    background:rgba(255,255,255,.03); color:rgba(255,255,255,.35);
  }
  .subcell.filled { background:rgba(58,163,255,.18); }
  .subcell .label { font-size:11px; color:rgba(255,255,255,.6); position:absolute; top:3px; left:5px; font-weight:600; letter-spacing:.5px; }
  .subcell .label.empty-lbl { position:relative; top:auto; left:auto; font-size:13px; font-weight:500; }
  .subcell .game-mini { display:flex; flex-direction:column; gap:2px; line-height:1.2; align-items:center; max-width:100%; }
  .subcell .game-mini .team { font-weight:700; }
  .subcell .game-mini .vs { opacity:.55; font-size:.7em; margin:1px 0; }
  .subcell .game-mini .div  { opacity:.8; margin-top:5px; font-size:.65em; font-weight:400; }
  .subcell.carryover { outline:1px dashed rgba(255,255,255,.22); }
  .subcell.carryover .carry-tag {
    position:absolute; top:3px; right:5px; font-size:10px; color:rgba(255,255,255,.6);
    background:rgba(0,0,0,.25); padding:1px 5px; border-radius:3px;
  }
  .subcell.age-u7  { background: rgba(155,140,255,.22); }
  .subcell.age-u8  { background: rgba(122,214,255,.22); }
  .subcell.age-u9  { background: rgba(122,223,176,.22); }
  .subcell.age-u10 { background: rgba(167,226,106,.22); }
  .subcell.age-u11 { background: rgba(216,219,90,.22); }
  .subcell.age-u12 { background: rgba(255,195,110,.22); }
  .subcell.age-u14 { background: rgba(255,157,110,.22); }
  .subcell.age-u16 { background: rgba(255,122,144,.22); }
  .subcell.age-u19 { background: rgba(255,122,223,.22); }
  .subcell.age-senior { background: rgba(58,163,255,.25); }
  .subcell.age-gent   { background: rgba(169,136,255,.25); }
  .subcell.age-junior { background: rgba(86,227,211,.22); }
  .subcell.age-trim   { background: rgba(150,150,150,.22); }
  .subcell.age-gk     { background: rgba(95,211,200,.22); }
  .subcell.age-other  { background: rgba(107,114,128,.22); }
  .subcell.training   { border-style:dashed; border-color:rgba(255,255,255,.35); }
  .subcell.empty.safety {
    background:repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 6px, transparent 6px 12px);
    color:rgba(255,255,255,.6);
  }
  .subcell.training .game-mini .team { font-weight:600; }
  .subcell .kind-tag {
    position:absolute; top:3px; right:5px; font-size:9px; letter-spacing:.6px;
    color:rgba(255,255,255,.65); background:rgba(0,0,0,.3); padding:1px 5px; border-radius:3px;
    text-transform:uppercase; font-weight:700;
  }
  .field-card .games-list .row.training .t { color:var(--muted); }
  .field-card .games-list .row .conflict-tag { font-size:11px; color:#ffb3c0; }
  .legend .chip .sw.dashed { background:transparent; border:1px dashed var(--muted); }
  .field-card .games-list { margin-top:12px; font-size:14px; color:var(--muted); }
  .field-card .games-list .row { display:flex; gap:10px; padding:4px 0; align-items:baseline; }
  .field-card .games-list .row .t { color:var(--text); font-variant-numeric:tabular-nums; font-weight:600; min-width:46px; }
  .field-card .games-list .row .s { color:var(--text); flex:1; display:flex; flex-direction:column; gap:2px; }
  .field-card .games-list .row .s .match-teams { font-weight:500; }
  .field-card .games-list .row .s .match-div { font-size:12px; color:var(--muted); }
  .field-card .games-list .row .sub-tag { font-size:11px; color:var(--muted); align-self:flex-start; }
  .field-card .games-list .row.carry .t::after { content:" •"; color:var(--accent2); }
  .field-card.idle .pitch { opacity:.5; }
  .field-card.idle .games-list { font-style:italic; }

  /* Legend */
  .legend { display:flex; gap:10px; flex-wrap:wrap; margin: 16px 0 0; font-size:11px; color:var(--muted); }
  .legend .chip { display:inline-flex; align-items:center; gap:5px; padding:2px 6px; background:var(--panel2); border:1px solid var(--line); border-radius:5px; }
  .legend .chip .sw { width:8px; height:8px; border-radius:2px; }

  /* ======== TEAMS VIEW ======== */
  .team-controls {
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin:0 auto 18px; max-width:900px;
  }
  .team-controls label { color:var(--muted); font-size:13px; }
  .team-controls select {
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:8px 12px; font:inherit; font-size:15px; min-width:120px;
  }
  .team-controls .team-comp { color:var(--accent); font-weight:600; font-size:15px; }
  /* All team-page sections share a consistent width and center on the page. */
  .team-section { max-width:900px; margin:0 auto 24px; }
  /* Standings + Vorige speeldag stack vertically — cleaner than the old 1.4fr / 1fr split. */
  .team-section.pool-row { display:block; max-width:900px; }
  .team-section.pool-row .pool-col { margin-bottom:24px; }
  .team-section.pool-row .pool-col:last-child { margin-bottom:0; }
  .team-section h2 {
    font-size:16px; margin:0 0 10px; color:var(--text); font-weight:600;
    letter-spacing:.3px; text-transform:uppercase; opacity:.85;
  }
  .empty-section { color:var(--muted); padding:18px; background:var(--panel); border:1px dashed var(--line); border-radius:8px; font-style:italic; }
  .standing-wrap { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  table.standing-table { width:100%; border-collapse:collapse; font-size:14px; }
  table.standing-table th {
    text-align:left; padding:10px 12px; background:var(--panel2);
    color:var(--muted); font-weight:600; font-size:12px;
    text-transform:uppercase; letter-spacing:.5px;
    border-bottom:1px solid var(--line);
  }
  table.standing-table th.num,
  table.standing-table td.num { text-align:right; font-variant-numeric:tabular-nums; }
  table.standing-table td {
    padding:9px 12px; border-bottom:1px solid var(--line);
  }
  table.standing-table tr:last-child td { border-bottom:none; }
  table.standing-table td.rank { color:var(--muted); width:40px; }
  table.standing-table td.team { font-weight:500; }
  table.standing-table tr.ours { background:rgba(58,163,255,.13); }
  table.standing-table tr.ours td.team { color:var(--accent); font-weight:700; }

  ul.match-list { list-style:none; padding:0; margin:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }

  /* ======== UNIFIED MATCH ROW (umr) — used by every match list everywhere ======== */
  ul.umr-list { list-style:none; padding:0; margin:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .umr {
    display:grid;
    grid-template-columns: 60px minmax(0,1fr) 80px minmax(0,1fr) 110px;
    gap:12px; align-items:center;
    padding:10px 14px; border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .umr:last-child { border-bottom:none; }
  .umr.umr-bare { grid-template-columns: minmax(0,1fr) 80px minmax(0,1fr); }
  .umr-date { color:var(--muted); font-variant-numeric:tabular-nums; font-weight:600; font-size:13px; }
  .umr-home { text-align:right; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .umr-away { text-align:left;  min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .umr-mid {
    font-variant-numeric:tabular-nums; font-weight:700;
    text-align:center; padding:4px 8px; border-radius:6px;
    background:var(--panel2); border:1px solid var(--line);
    font-size:13px; justify-self:center; min-width:70px;
  }
  .umr-mid.win  { background:rgba(122,223,176,.20); border-color:rgba(122,223,176,.45); color:#aef0c8; }
  .umr-mid.loss { background:rgba(255,122,144,.16); border-color:rgba(255,122,144,.40); color:#ffb3c0; }
  .umr-mid.draw { background:rgba(255,184,107,.16); border-color:rgba(255,184,107,.40); color:#ffd29a; }
  .umr-mid.time { background:transparent; color:var(--muted); border-style:dashed; font-weight:600; }
  .umr-mid.empty { background:transparent; border:none; color:var(--muted); }
  .umr-trail { display:flex; justify-content:flex-end; align-items:center; gap:6px; min-width:0; }
  .umr-outcome {
    width:26px; text-align:center; font-weight:700; font-size:12px;
    padding:2px 0; border-radius:4px;
  }
  .umr-outcome.win  { background:rgba(122,223,176,.25); color:#aef0c8; }
  .umr-outcome.loss { background:rgba(255,122,144,.22); color:#ffb3c0; }
  .umr-outcome.draw { background:rgba(255,184,107,.20); color:#ffd29a; }
  .umr.our-match { background:rgba(58,163,255,.10); }
  /* Field-badge and map-link styling kept consistent in trail column */
  .umr-trail .field-badge,
  .umr-trail .loc-tag { white-space:nowrap; }
  /* One grid for ALL match-rows.
     Desktop: date | matchup | trailing | outcome (4 cols, score/badge fixed at right).
     Mobile (≤720): collapses to a 2-line card via grid-template-areas (see media query). */
  .match-row {
    display:grid;
    grid-template-columns: 64px minmax(0, 1fr) auto 36px;
    grid-template-areas: "datecol matchup trailing outcome";
    gap:12px; align-items:center;
    padding:10px 14px; border-bottom:1px solid var(--line); font-size:14px;
  }
  .match-row:last-child { border-bottom:none; }
  .match-row .row-date {
    grid-area:datecol; color:var(--muted); font-variant-numeric:tabular-nums;
    font-weight:600; display:flex; flex-direction:column; gap:2px; line-height:1.1;
  }
  .match-row .row-date .row-time { color:var(--muted); font-weight:500; font-size:12px; }
  .match-row .row-matchup {
    grid-area:matchup; color:var(--text); min-width:0;
    display:flex; flex-wrap:wrap; align-items:baseline; gap:0 6px;
  }
  .match-row .row-matchup .vs-dash { opacity:.45; }
  .match-row .row-matchup .row-div {
    flex-basis:100%; font-size:12px; color:var(--muted); margin-top:2px;
  }
  .match-row .row-trailing { grid-area:trailing; display:flex; align-items:center; justify-content:flex-end; }
  .match-row .row-outcome  { grid-area:outcome; text-align:center; font-weight:700; font-size:12px; padding:2px 0; border-radius:4px; min-width:24px; }
  .match-row .row-outcome.win  { background:rgba(122,223,176,.25); color:#aef0c8; }
  .match-row .row-outcome.loss { background:rgba(255,122,144,.22); color:#ffb3c0; }
  .match-row .row-outcome.draw { background:rgba(255,184,107,.20); color:#ffd29a; }
  /* Rows without an outcome shrink the last column to nothing */
  .match-row:not(:has(.row-outcome)) { grid-template-columns: 64px minmax(0, 1fr) auto; grid-template-areas: "datecol matchup trailing"; }

  /* Score pill — fixed compact width regardless of score text length */
  .match-row .score-pill {
    font-variant-numeric:tabular-nums; font-weight:700; font-size:14px;
    padding:3px 10px; border-radius:6px; background:var(--panel2); border:1px solid var(--line);
    text-align:center; min-width:70px;
  }
  .match-row .score-pill.win  { background:rgba(122,223,176,.18); border-color:rgba(122,223,176,.45); color:#aef0c8; }
  .match-row .score-pill.loss { background:rgba(255,122,144,.16); border-color:rgba(255,122,144,.40); color:#ffb3c0; }
  .match-row .score-pill.draw { background:rgba(255,184,107,.14); border-color:rgba(255,184,107,.40); color:#ffd29a; }
  .match-row .score-pill.upcoming { background:transparent; color:var(--muted); border-style:dashed; }

  /* Location tag (thuis / uit) */
  .match-row .loc-tag {
    display:inline-block; padding:3px 9px; border-radius:5px;
    font-size:11px; font-weight:600; letter-spacing:.5px; text-transform:uppercase;
    background:var(--panel2); color:var(--muted); border:1px solid var(--line);
  }
  .match-row .loc-tag.home { background:rgba(58,163,255,.14); color:#7dbcff; border-color:rgba(58,163,255,.30); }
  .match-row .loc-tag.away { background:rgba(169,136,255,.14); color:#c4a8ff; border-color:rgba(169,136,255,.30); }
  .match-row .loc-tag.map-loc { text-decoration:none; cursor:pointer; }
  .match-row .loc-tag.map-loc:hover { background:rgba(169,136,255,.28); border-color:rgba(169,136,255,.55); }

  /* Favorite-team chip banner (below header) */
  #fav-bar { display:flex; align-items:center; gap:8px; padding:8px 20px; background:var(--panel); border-bottom:1px solid var(--line); }
  .fav-chip {
    background:rgba(255,210,90,.13); border:1px solid rgba(255,210,90,.45);
    color:#ffd97a; font-weight:600; font-size:13px;
    padding:5px 11px; border-radius:8px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
  }
  .fav-chip:hover { background:rgba(255,210,90,.22); }
  .fav-chip .fav-star { font-size:14px; }
  .fav-clear {
    background:var(--panel2); border:1px solid var(--line); color:var(--muted);
    border-radius:6px; padding:3px 8px; font:inherit; font-size:12px; cursor:pointer;
  }
  .fav-clear:hover { color:var(--text); border-color:var(--accent); }

  /* Favorite toggle on team page */
  .fav-toggle {
    background:var(--panel2); border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer;
  }
  .fav-toggle:hover { color:var(--text); border-color:var(--accent); }
  .fav-toggle.active {
    background:rgba(255,210,90,.16); color:#ffd97a; border-color:rgba(255,210,90,.55);
  }

  /* Volgende wedstrijd hero card — compact, teams on a single line. */
  .next-match-hero {
    max-width:900px; margin:0 auto 20px;
    background:linear-gradient(140deg, rgba(58,163,255,.10) 0%, rgba(122,223,176,.06) 100%);
    border:1px solid rgba(58,163,255,.30); border-radius:12px; padding:12px 16px;
  }
  .next-match-hero .hero-tag {
    font-size:10px; text-transform:uppercase; letter-spacing:1px;
    color:var(--accent); font-weight:700; margin-bottom:4px;
  }
  .next-match-hero .hero-teams {
    font-size:18px; font-weight:700; line-height:1.3;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-bottom:4px;
  }
  .next-match-hero .hero-teams .hero-vs { color:var(--muted); font-weight:400; font-size:13px; padding:0 6px; }
  .next-match-hero .hero-meta {
    font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums;
    display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px;
  }
  .next-match-hero .hero-meta .sep { opacity:.45; }
  .next-match-hero .map-link {
    display:inline-flex; align-items:center; gap:4px;
    color:#c4a8ff; text-decoration:none; font-weight:600; font-size:12px;
    padding:3px 9px; border-radius:5px;
    background:rgba(169,136,255,.14); border:1px solid rgba(169,136,255,.4);
  }
  .next-match-hero .map-link:hover { background:rgba(169,136,255,.26); border-color:rgba(169,136,255,.7); }
  .next-match-hero .field-badge { font-size:12px; padding:3px 9px; }

  /* Veldbezetting toggle (All fields ↔ One field) */
  .vb-controls {
    display:flex; align-items:center; gap:12px; margin:0 auto 14px;
    flex-wrap:wrap; max-width:1400px;
  }
  /* On desktop the 3 pitches are already visible side-by-side, so the mini-map is
     redundant. Keep it only on phones (where Eén veld hides 2 of the 3). */
  @media (min-width: 721px) {
    .club-map { display:none; }
  }
  .view-toggle {
    display:inline-flex; background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; padding:3px;
  }
  .view-toggle button {
    background:transparent; color:var(--muted); border:none;
    padding:7px 14px; font:inherit; font-size:14px; font-weight:600; cursor:pointer;
    border-radius:7px;
  }
  .view-toggle button.active { background:var(--accent); color:#0b1320; }
  .vb-controls #vb-field-select,
  .vb-controls #vb-slot-select {
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:7px 12px; font:inherit; font-size:14px; font-weight:600;
    cursor:pointer; font-variant-numeric:tabular-nums;
  }
  .club-map .map-pitch.selected { stroke:var(--accent); stroke-width:3; fill:#2a5a3a; }
  .club-map .map-pitch.has-games:not(.selected) { fill:#2a5a3a; stroke:var(--accent2); stroke-width:2; }

  /* Field badge — clickable, navigates into Veldbezetting.
     Dotted underline signals "this is interactive" without competing with the colored chip. */
  .field-badge {
    display:inline-flex; align-items:center; gap:5px;
    padding:4px 10px; border-radius:5px; cursor:pointer;
    font-size:12px; font-weight:600; letter-spacing:.3px;
    background:rgba(122,223,176,.16); color:#aef0c8; border:1px solid rgba(122,223,176,.4);
    transition: background 120ms ease, border-color 120ms ease;
    white-space:nowrap;
    text-decoration:underline; text-decoration-style:dotted;
    text-decoration-color:rgba(174,240,200,.6); text-underline-offset:3px;
  }
  .field-badge:hover {
    background:rgba(122,223,176,.32); border-color:rgba(122,223,176,.7);
    text-decoration-color:#aef0c8;
  }
  .field-badge .field-arrow { opacity:.7; font-size:11px; text-decoration:none; }

  /* Clickable Olympia team names — visible wherever a team name is rendered. */
  .team-link {
    color:var(--accent); cursor:pointer; border-bottom:1px dotted transparent;
    transition: border-color 120ms ease, color 120ms ease;
  }
  .team-link:hover { color:#9bcdff; border-bottom-color:#9bcdff; }
  .game .teams .team-link,
  .subcell .team .team-link { color:inherit; border-bottom-color:rgba(255,255,255,.25); }
  .game .teams .team-link:hover,
  .subcell .team .team-link:hover { border-bottom-color:#fff; }

  /* ======== WEEK VIEW ======== */
  .week-controls {
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 16px; margin:0 auto 18px; max-width:900px;
  }
  .week-controls button {
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:8px 14px; font:inherit; font-size:14px; cursor:pointer;
  }
  .week-controls button:hover:not([disabled]) { border-color:var(--accent); }
  .week-controls button[disabled] { opacity:.4; cursor:default; }
  .week-controls .week-label { flex:1; display:flex; flex-direction:column; gap:2px; }
  .week-controls .week-range { font-size:17px; font-weight:600; letter-spacing:.2px; }
  .week-controls .week-meta { color:var(--muted); font-size:12px; }
  /* ======== STATISTIEK ======== */
  .stats { max-width:900px; margin:0 auto; }
  .stats-filters { display:flex; flex-wrap:wrap; gap:10px 12px; align-items:center; margin-bottom:22px; }
  .stats-filters select, .stats-filters input[type=date] {
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:7px 10px; font:inherit; font-size:14px; font-variant-numeric:tabular-nums;
  }
  .stats-filters .dash { color:var(--muted); }
  .stats-filters .break { flex-basis:100%; height:0; }
  .stats-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; }
  .stats-head .big { font-size:40px; font-weight:700; letter-spacing:-.02em; line-height:1; font-variant-numeric:tabular-nums; color:#aef0c8; }
  .stats-head .big small { font-size:14px; font-weight:500; color:var(--muted); letter-spacing:0; margin-left:6px; }
  .stats-head .n { color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; }
  .wdl { display:flex; height:30px; border-radius:8px; overflow:hidden; background:var(--panel2); font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
  .wdl span { display:flex; align-items:center; justify-content:center; min-width:0; overflow:hidden; white-space:nowrap; }
  .wdl .w { background:rgba(122,223,176,.30); color:#aef0c8; }
  .wdl .d { background:rgba(255,184,107,.26); color:#ffd29a; }
  .wdl .l { background:rgba(255,122,144,.26); color:#ffb3c0; }
  .wdl.mini { height:10px; border-radius:5px; }
  .wdl-key { display:flex; gap:16px; margin:8px 0 26px; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .wdl-key b { color:var(--text); font-weight:600; }
  /* One row per club / group / team: rank · name · full W/G/V bar · matches */
  .srows { list-style:none; margin:0; padding:0; }
  .srow {
    display:grid; grid-template-columns:26px 150px minmax(0,1fr) 34px; gap:10px; align-items:center;
    padding:7px 0; border-bottom:1px solid var(--line); font-size:14px;
  }
  .srow:last-child { border-bottom:none; }
  .srow.norank { grid-template-columns:150px minmax(0,1fr) 34px; }
  .srow .rk { color:var(--muted); font-variant-numeric:tabular-nums; }
  .srow .nm { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .srow .ct { text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  .srow .wdl { height:22px; border-radius:6px; font-size:12px; }
  .srow.click { cursor:pointer; }
  .srow.click:hover .nm { color:var(--accent); }
  .srow.ours .rk, .srow.ours .nm, .srow.ours .ct { color:var(--accent); font-weight:700; }
  .stats-note { color:var(--muted); font-size:12px; margin-top:14px; }

  .week-day { max-width:1100px; margin-bottom:18px; }
  .week-day h3 {
    margin:0 0 8px; font-size:15px; color:var(--text);
    text-transform:uppercase; letter-spacing:.5px; opacity:.85;
    display:flex; align-items:center; gap:10px;
  }
  .week-day.today h3 { color:var(--accent); opacity:1; }
  .week-day h3 .today-tag {
    font-size:10px; padding:2px 8px; border-radius:4px;
    background:var(--accent); color:#0b1320; font-weight:700; letter-spacing:.5px;
  }
  /* Week-view rows: time | matchup | division tag | score | outcome — all fixed except matchup */
  .week-day .match-row {
    grid-template-columns: 56px minmax(0, 1fr) 200px 90px 36px;
  }
  .week-day .match-row .div-tag {
    font-size:11px; color:var(--muted); white-space:nowrap;
    padding:3px 8px; border-radius:4px; background:var(--panel2); border:1px solid var(--line);
  }
  .week-day .match-row.upcoming .score-pill.upcoming {
    background:transparent; color:var(--muted); border-style:dashed;
  }

  /* ======== POOL-ROW (Rangschikking + Vorige speeldag stacked vertically) ======== */
  .team-section.pool-row {
    display:block; max-width:900px; margin:0 auto 24px;
  }
  .team-section.pool-row .pool-col + .pool-col { margin-top:24px; }
  .pool-col { display:flex; flex-direction:column; min-width:0; }
  .pool-col h2 {
    font-size:16px; margin:0 0 10px; color:var(--text); font-weight:600;
    letter-spacing:.3px; text-transform:uppercase; opacity:.85;
  }
  .pool-week-list { display:flex; flex-direction:column; gap:10px; }
  .pool-day {
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px 10px;
  }
  .pool-day.today { border-color:rgba(58,163,255,.45); }
  .pool-day-header {
    font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);
    padding:4px 0 6px; display:flex; align-items:center; gap:8px;
  }
  .pool-day.today .pool-day-header { color:var(--accent); }
  .pool-day-header .today-tag {
    font-size:10px; padding:1px 7px; border-radius:4px;
    background:var(--accent); color:#0b1320; font-weight:700; letter-spacing:.5px;
  }
  ul.pool-week-matches { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:4px; }
  .pool-match {
    display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px;
    background:var(--panel2); font-size:13px;
  }
  .pool-match.our-match { background:rgba(58,163,255,.13); }
  .pool-match .pool-teams { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .pool-match .pool-score {
    font-variant-numeric:tabular-nums; font-weight:600;
    padding:2px 8px; border-radius:5px; min-width:54px; text-align:center;
    background:var(--panel); border:1px solid var(--line);
  }
  .pool-match .pool-score.played    { background:rgba(122,223,176,.18); border-color:rgba(122,223,176,.40); color:#aef0c8; }
  .pool-match .pool-score.scheduled { color:var(--muted); }

  /* ======== RESPONSIVE — tablet (<=1100px) ======== */
  @media (max-width: 1100px) {
    header { gap:10px; flex-wrap:wrap; padding:10px 14px; }
    header h1 { font-size:16px; }
    header h1 .sub { display:none; }
    header .tabs button { padding:6px 10px; font-size:13px; }
    main { padding:14px 14px 60px; }

    /* Tablet: keep Clubhuis as a slim right-side column spanning both rows */
    .fields-row { grid-template-columns: 1fr 1fr 50px; }
    .field-card.clubhuis { grid-column: 3 !important; grid-row: 1 !important; }
    .clubhuis-text { font-size:12px; letter-spacing:3px; }

    .team-section.pool-row { grid-template-columns: 1fr; }
    table.standing-table { font-size:13px; }
    table.standing-table th, table.standing-table td { padding:7px 8px; }
  }

  /* ======== RESPONSIVE — phone (<=720px) ========
     Strategy: compact sticky top bar (logo + title + date), tabs pushed to fixed
     bottom nav, single-column content, match-rows as cards with everything inline. */
  @media (max-width: 720px) {
    /* HEADER: one tight row at the top */
    header {
      gap:8px; padding:8px 10px; flex-wrap:nowrap;
    }
    header .logo { height:28px; padding:2px; border-radius:6px; }
    header h1 { font-size:14px; line-height:1.15; }
    header h1 .sub { display:none; }
    header .grow { display:none; }
    header .status { display:none; }
    header input[type=date] {
      padding:5px 6px; font-size:12px; flex:1; min-width:0; max-width:130px;
    }
    header button { padding:5px 8px; font-size:12px; }
    header #today { font-size:11px; padding:5px 8px; }

    /* TABS → fixed bottom navigation bar (native-app feel) */
    header .tabs {
      position:fixed; bottom:0; left:0; right:0; z-index:50;
      border-radius:0; padding:6px 4px; border:none; border-top:1px solid var(--line);
      background:var(--panel); box-shadow:0 -2px 12px rgba(0,0,0,.45);
      display:flex; justify-content:space-around; gap:2px;
    }
    header .tabs button {
      flex:1; padding:8px 4px; font-size:11px; font-weight:600;
      border-radius:8px; letter-spacing:.2px; text-align:center;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    header .tabs button.active { background:var(--accent); color:#0b1320; }
    /* Body needs bottom padding to clear the fixed nav */
    main { padding:14px 12px 80px; }

    /* TIMELINE: switch from 3-column horizontal-scroll to single-field-at-a-time
       via a field-switcher row. Logic in JS hides non-active columns. */
    .timeline-wrap {
      min-width:0;
      grid-template-columns: 44px 1fr !important;
      gap:4px;
    }
    .timeline-wrap .col-header { font-size:14px; padding:8px 6px; }
    .mobile-field-switcher {
      display:flex; align-items:center; gap:8px; margin-bottom:10px;
      background:var(--panel); border:1px solid var(--line); border-radius:10px;
      padding:8px 12px;
    }
    .mobile-field-switcher label { color:var(--muted); font-size:13px; }
    .mobile-field-switcher select {
      flex:1; background:var(--panel2); color:var(--text);
      border:1px solid var(--line); border-radius:8px; padding:8px 12px;
      font:inherit; font-size:14px; font-weight:600;
    }
    /* JS renders only the selected field's column on mobile — no CSS hiding needed */

    /* LAYOUT view: single column, full width. Clubhuis hidden by default on phone (saves
       vertical room). In landscape phone, bring it back as a narrow right-side bar. */
    .fields-row { grid-template-columns: 1fr; max-width:none; gap:12px; }
    .field-card { grid-column: 1 !important; grid-row: auto !important; padding:10px; }
    .field-card.clubhuis { display:none; }
    .field-card:not(.clubhuis):nth-child(4) { max-width:none; margin:0; }
    .subcell .game-mini .div { display:none; }
  }
  @media (max-width: 720px) and (orientation: landscape) {
    /* Phone landscape: revive Clubhuis as a thin right-edge bar so people still get
       the spatial reference even when squeezed horizontally. */
    .fields-row {
      grid-template-columns: 1fr 1fr 44px !important;
      max-width:none !important;
    }
    .field-card { grid-column: auto !important; grid-row: auto !important; }
    .field-card.clubhuis {
      display:flex !important;
      grid-column: 3 !important; grid-row: 1 !important;
      padding:4px; min-height:0;
    }
    .field-card:not(.clubhuis):nth-child(4) {
      grid-column: 1 / span 2 !important; grid-row: 2 !important;
    }
    .clubhuis-icon { font-size:22px; }
    .clubhuis-text { font-size:11px; letter-spacing:2px; }
  }
  /* General mobile rules — apply in BOTH orientations */
  @media (max-width: 720px) {
    /* MATCH-ROW as a 2-line card */
    .match-row {
      grid-template-columns: auto 1fr auto !important;
      grid-template-areas:
        "datecol matchup trailing"
        "datecol matchup outcome" !important;
      gap:6px 10px !important; padding:10px 12px !important;
      align-items:center; font-size:13px;
    }
    .match-row:not(:has(.row-outcome)) {
      grid-template-areas: "datecol matchup trailing" !important;
    }
    .match-row .row-date {
      grid-area:datecol; flex-direction:column; gap:1px;
      font-size:13px; line-height:1.1; min-width:42px;
    }
    .match-row .row-date .row-time { font-size:12px; }
    .match-row .row-matchup {
      grid-area:matchup; font-size:13px; line-height:1.3;
    }
    .match-row .row-matchup .row-div { font-size:11px; margin-top:1px; }
    .match-row .row-trailing { grid-area:trailing; }
    .match-row .row-outcome  { grid-area:outcome; justify-self:end; align-self:end; }
    .match-row .score-pill { font-size:12px; padding:2px 8px; min-width:56px; }
    .match-row .loc-tag    { font-size:10px; padding:2px 7px; }
    .match-row .field-badge{ font-size:11px; padding:3px 8px; }

    /* TEAMS: stack standings + pool-week */
    .team-section.pool-row { grid-template-columns: 1fr; gap:16px; }
    .team-section { max-width:none !important; }
    .team-controls { padding:10px 12px; gap:8px; }
    .team-controls .team-comp { font-size:13px; }
    .team-controls select { font-size:14px; padding:6px 10px; min-width:100px; }

    /* WEEK: stats 2x2 + tighter controls */
    .week-controls { padding:10px 12px; gap:8px; }
    .week-controls .week-range { font-size:14px; }
    .week-controls .week-meta  { font-size:11px; }
    .stats-head .big { font-size:34px; }
    .stats-filters { gap:8px; margin-bottom:18px; }
    .stats-filters .view-toggle { flex:1 1 100%; }
    /* Phone: name and count on one line, the bar full width underneath */
    .srow { grid-template-columns:22px minmax(0,1fr) auto; grid-template-areas:"rk nm ct" "bar bar bar"; gap:4px 8px; padding:9px 0; }
    .srow.norank { grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"nm ct" "bar bar"; }
    .srow .rk { grid-area:rk; } .srow .nm { grid-area:nm; } .srow .ct { grid-area:ct; } .srow .wdl { grid-area:bar; }
    .week-day h3 { font-size:13px; }

    /* Resultaten mobile: hide division line (kept on desktop) + tighter rows */
    .rd-row { gap:8px; padding:8px 10px; font-size:13px; }
    .rd-row .rd-div { display:none; }
    .rd-row .rd-score { font-size:12px; padding:2px 6px; min-width:54px; }
    .rd-row .rd-mid { min-width:60px; }
    /* Unified row tighter on phones, keeps the 5-column shape */
    .umr {
      grid-template-columns: 44px minmax(0,1fr) 64px minmax(0,1fr) 56px;
      gap:6px; padding:8px 10px; font-size:12px;
    }
    .umr.umr-bare { grid-template-columns: minmax(0,1fr) 60px minmax(0,1fr); gap:8px; }
    .umr.umr-bare .umr-home, .umr.umr-bare .umr-away { white-space:normal; line-height:1.2; overflow:visible; }
    .umr-date { font-size:11px; }
    .umr-mid  { font-size:11px; padding:3px 5px; min-width:56px; }
    .umr-outcome { width:22px; font-size:10px; }
    .umr-trail .field-badge,
    .umr-trail .loc-tag { font-size:10px; padding:2px 6px; }

    /* STANDINGS on phones — show ALL 10 cols. Fixed table layout, narrow numeric cols,
       team name wraps to 2 lines. Padding/font shrunk so it fits 375px without overflow. */
    table.standing-table { font-size:11px; table-layout:fixed; width:100%; }
    table.standing-table th, table.standing-table td { padding:5px 3px; }
    table.standing-table th { font-size:9px; letter-spacing:0; }
    table.standing-table td.team { white-space:normal; line-height:1.2; font-size:11px; padding-left:5px; }
    table.standing-table td.rank, table.standing-table th.col-0 { padding-left:5px; }
    /* Per-column widths (sum < 350px so it fits a 375px viewport with body padding) */
    table.standing-table .col-0 { width:22px;  text-align:left; }   /* # */
    /* Team gets all remaining space (col-1 = auto) */
    table.standing-table .col-2,                                    /* P */
    table.standing-table .col-3,                                    /* W */
    table.standing-table .col-4,                                    /* D */
    table.standing-table .col-5,                                    /* L */
    table.standing-table .col-6 { width:21px; text-align:center; }  /* Pt */
    table.standing-table .col-7 { width:30px; text-align:center; }  /* Ds (signed) */
    table.standing-table .col-8,                                    /* + */
    table.standing-table .col-9 { width:24px; text-align:center; }  /* - */

    /* POOL-MATCH (this-week-in-poule) — tighten too */
    .pool-match { font-size:12px; padding:5px 7px; }
    .pool-match .pool-score { min-width:48px; font-size:12px; padding:1px 6px; }

    /* Legend chips — wrap freely */
    .legend { font-size:10px; }

    /* Favorite chip banner — tight on phone */
    #fav-bar { padding:6px 10px; gap:6px; }
    .fav-chip { font-size:12px; padding:4px 9px; }
    .fav-clear { padding:2px 7px; font-size:11px; }

    /* Volgende wedstrijd hero card — tight on phone, teams one line */
    .next-match-hero { padding:10px 12px; max-width:none; }
    .next-match-hero .hero-teams { font-size:15px; }
    .next-match-hero .hero-meta { font-size:11px; gap:4px 8px; }
    .next-match-hero .field-badge,
    .next-match-hero .map-link { font-size:11px; padding:2px 7px; }

    /* Veldbezetting toggle — fill width, dropdown below */
    .vb-controls { gap:8px; }
    .view-toggle { flex:1; }
    .view-toggle button { flex:1; padding:7px 8px; font-size:13px; }
    .vb-controls #vb-field-select,
    .vb-controls #vb-slot-select { width:100%; flex-basis:100%; }

    /* Team controls — one tight row on phone */
    .team-controls {
      padding:8px 10px; gap:8px; flex-wrap:nowrap; align-items:center; overflow:hidden;
    }
    .team-controls label { display:none; }                     /* "Team" word is redundant */
    .team-controls select { flex:0 0 auto; max-width:140px; min-width:90px; padding:6px 8px; font-size:13px; }
    .team-controls .team-comp {
      flex:1 1 auto; min-width:0; font-size:12px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .fav-toggle { flex:0 0 auto; font-size:14px; padding:5px 9px; }
    .fav-toggle .fav-label { display:none; }                   /* show only the star */
  }
  /* OlympiaData only (data-site="data"): match the Clubs en teams design layer. The calendar site is unaffected. */
  html[data-site="data"] { --ol:#ffb86b; --gut:max(20px, calc((100vw - 1360px) / 2 + 20px)); }
  html[data-site="data"] body { font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  html[data-site="data"] main { padding:18px var(--gut) 64px; }
  html[data-site="data"] header { padding-left:var(--gut); padding-right:var(--gut); }
  html[data-site="data"] .stats { max-width:none; margin:0; }
  html[data-site="data"] .srow.ours .rk, html[data-site="data"] .srow.ours .nm, html[data-site="data"] .srow.ours .ct { color:var(--ol); }
  html[data-site="data"] .srow.ours { background:rgba(255,184,107,.08); box-shadow:-8px 0 0 rgba(255,184,107,.08), 8px 0 0 rgba(255,184,107,.08), -11px 0 0 var(--ol); }
  html[data-site="data"] .srow .wdl { border-radius:7px; }
</style>
